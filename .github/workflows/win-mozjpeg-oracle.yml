# One bounded diagnostic for the Windows falsification P0. This is deliberately not the corpus
# runner: it installs exactly the fixed mozjpeg fixture, creates no record, publishes no queue edit,
# and retains only logs plus the bounded `cjpeg-oracle.json` metadata.
name: win-mozjpeg-oracle

on:
  # `workflow_dispatch` cannot run an unmerged workflow by filename. This isolated branch trigger
  # makes the first post-review push its only launch path, without touching the corpus lane.
  push:
    branches: [probe/zero-sandbox-14867463]
  workflow_dispatch:
    inputs:
      nub_ref:
        description: verified nubjs/nub commit or ref to build with the catalog-override feature
        required: true
        default: 'eff8e8d3929f83f21ddb75b7993e8d2614978791'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      NUB_REF: ${{ inputs.nub_ref || 'eff8e8d3929f83f21ddb75b7993e8d2614978791' }}
      # The falsification pair is about the real global-virtual-store layout. Do not let CI choose
      # project-local `.store`, which would make the warm-state question disappear.
      npm_config_enable_global_virtual_store: 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: { node-version: '22' }

      - name: Check the bounded oracle harness
        shell: bash
        run: node --test harness/v2/cjpeg-oracle.test.mjs harness/v2/assert-cjpeg-oracle.test.mjs harness/v2/collect-preflight.test.mjs harness/v2/windows-invariance.test.mjs harness/v2/warm-reuse.test.mjs

      - name: Resolve and build the nub binary under test
        shell: bash
        run: |
          set -eu
          # `ls-remote <url> <sha>` matches ref names, not an arbitrary reachable object, so it
          # silently returns nothing for the explicit commit this probe is meant to pin. Fetch the
          # input itself and name the resulting object instead; branch/ref and full SHA both work.
          git init /tmp/nubsrc
          cd /tmp/nubsrc
          git remote add origin https://github.com/nubjs/nub.git
          git fetch --depth=1 origin "$NUB_REF"
          SHA=$(git rev-parse FETCH_HEAD)
          git checkout --detach FETCH_HEAD
          echo "NUB_SHA=$SHA" >> "$GITHUB_ENV"
          echo "measuring nub $NUB_REF @ $SHA"
          { echo "nub=$SHA"; git -C "$GITHUB_WORKSPACE" rev-parse HEAD; rustc -Vv; node --version; uname -a; } > /tmp/oracle-environment.txt
          # Match the build-jail framework artifact: the lifecycle runtime needs the native addon,
          # its root JS dependencies, and the production BusyBox sidecar—not cargo's bare binary.
          npm install --no-audit --no-fund --loglevel=error
          npm install --global node-gyp@12.4.0 --no-audit --no-fund
          (cd crates/nub-native && cargo build --profile fast)
          mkdir -p runtime/addons
          cp target/fast/nub_native.dll runtime/addons/nub-native.node
          echo '07bb1e5b095b00d68a695481f9240879f33c5724b40aa2308f999d54ed78f075  vendor/busybox-w32/busybox64.exe' | sha256sum -c -
          cargo build -p nub-cli --profile fast --features nub-cli/build-jail-catalog-override
          node -e "require.resolve('@oxc-project/runtime/helpers/usingCtx')"
          cp vendor/busybox-w32/busybox64.exe target/fast/busybox.exe
          sha256sum target/fast/nub.exe runtime/addons/nub-native.node target/fast/busybox.exe > /tmp/oracle-binaries.sha256
          echo "NUB_BIN=/tmp/nubsrc/target/fast/nub.exe" >> "$GITHUB_ENV"

      - name: Prove the override feature engages
        shell: bash
        run: |
          set -eu
          printf '{"packages":{"__oracle_probe__":{"default":{"network":true}}}}' > /tmp/cat-good.json
          OUT=$(NUB_BUILD_JAIL_CATALOG=/tmp/cat-good.json "$NUB_BIN" --version 2>&1)
          printf '%s\n' "$OUT"
          case "$OUT" in *OVERRIDDEN*) ;; *) echo 'catalog override did not engage' >&2; exit 1 ;; esac

      - name: Run only the mozjpeg warm-state oracle
        shell: bash
        run: |
          set +e
          node harness/v2/falsify.mjs --nub "$NUB_BIN" --case network-gate --keep-roots --json /tmp/falsify-mozjpeg.json 2>&1 | tee /tmp/falsify-mozjpeg.log
          RC=${PIPESTATUS[0]}
          echo "FALSIFY_EXIT=$RC" >> "$GITHUB_ENV"
          echo "falsify exit=$RC (0=control passed; 1=P0 reproduced; 2=inconclusive)"
          test -f /tmp/falsify-mozjpeg.json || exit 1
          node harness/v2/assert-cjpeg-oracle.mjs /tmp/falsify-mozjpeg.json || exit "$?"
          # This is a diagnostic, not a green gate: preserve its actual falsification verdict.
          exit "$RC"

      - name: Collect bounded oracle evidence
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          for file in falsify-mozjpeg.json falsify-mozjpeg.log oracle-environment.txt oracle-binaries.sha256; do
            if [ -f "/tmp/$file" ]; then cp "/tmp/$file" reports/; fi
          done
          node harness/v2/collect-preflight.mjs /tmp/falsify-mozjpeg.log "$GITHUB_WORKSPACE/reports/preflight-evidence"

      - name: Preserve bounded oracle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: win-mozjpeg-oracle-${{ github.run_id }}
          path: reports
          if-no-files-found: warn
          retention-days: 14
