name: Catalog instrument CI

on:
  push:
    branches: [probe/catalog-instrument-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          sparse-checkout: |
            harness
            inputs
            .github
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Run the complete harness test suite
        run: |
          set -euo pipefail
          mkdir -p reports
          node harness/run-tests.mjs 2>&1 | tee reports/harness-tests.log
      - name: Upload harness test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-instrument-${{ matrix.os }}
          path: reports/harness-tests.log
          if-no-files-found: warn
