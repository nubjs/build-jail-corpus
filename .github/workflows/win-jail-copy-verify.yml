# Does the Windows build jail work once the linker stops HARDLINKING into it?
#
# THE DEFECT, measured by win-acl-probe run 31126235717: a confined lifecycle script cannot read
# its own entry point. Node starts, enters its own ESM loader and dies at `getSourceSync`:
#
#   Error: EPERM: operation not permitted, open
#   'C:\jail\a1\node_modules\.store\@apollo+rover@0.2.1\node_modules\@apollo\rover\install.js'
#
# Windows attaches the security descriptor to the file OBJECT, not the directory entry, so a store
# file hardlinked into the install keeps the descriptor it was created with under the CAS. That run
# measured the denied file at SYSTEM/Administrators/<user> full control with NOT ONE ace marked
# `(I)`, and `fsutil hardlink list` named four entries for that one object -- two inside the CAS.
# A descriptor that never auto-inherited is one advapi32's propagation pass also skips, so the
# jail's inheritable grant lands on every sibling the linker CREATED and never on the linked one.
#
# THE FIX under test (nubjs/nub branch `win-jail-copy`): on Windows, when the embedder's lifecycle
# sandbox will confine, the linker resolves `LinkStrategy::Copy` and the side-effects cache
# restores by copy. A copied file is created inside the granted directory and inherits normally.
#
# ⛔ WHY THIS IS NOT A RE-RUN OF `win-acl-probe`. That workflow RESTORES a cached `nub.exe` under a
# PREFIX restore-key (`nub-bin-v1-windows-`), so it can never measure a new commit -- it would
# re-measure whatever binary the corpus fleet cached last, and report it as a result for the fix.
# This one keys the cache on the RESOLVED SHA with no prefix fallback, and prints that SHA.
#
# ⛔ THE DISCRIMINATOR IS `fsutil hardlink list`, AND IT CARRIES ITS OWN NEGATIVE CONTROL. `rc=0` is
# not "the fix engaged" -- an install can pass for reasons that have nothing to do with linking. A0
# runs the SAME install with the jail switched off (`nub.jsonc` `install.buildJail: false`), where
# the override must NOT engage and the file must still report MORE THAN ONE name. If A0 reports one
# name, the discriminator cannot tell the two states apart and every other arm here is void.
#
# ⛔ EVERY STEP RUNS UNDER `bash --noprofile --norc {0}` (no `-e`) except the build. A non-zero exit
# is a legitimate outcome of the arms, and the default `-e` shell aborts before the forensics run.
#
# ⛔ MSYS MANGLES A `/flag` ARGUMENT INTO A PATH, AND THAT IS WHAT VOIDED win-acl-probe's STEP 0.
# `icacls 'C:\dst' /grant 'Guests:(OI)(CI)(R)'` came back `Invalid parameter "C:/Program
# Files/Git/grant"`, so the grant never applied, the positive control never inherited, and the step
# printed `S0 INVALID`. Anything with a slash-flag here is prefixed `MSYS_NO_PATHCONV=1`.
name: win-jail-copy-verify

on:
  workflow_dispatch:
    inputs:
      nub_ref:
        description: 'nubjs/nub ref to build and measure'
        default: 'win-jail-copy'
      pkg:
        description: 'package@version whose install script reads its own entry point'
        default: '@apollo/rover@0.2.1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PKG: ${{ inputs.pkg || '@apollo/rover@0.2.1' }}
      NUB_REF: ${{ inputs.nub_ref || 'win-jail-copy' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # ── S0: the premise, with the mangling fixed ───────────────────────────────────────────────
      # No nub, no jail, no package manager: does a hard link into a directory pick up that
      # directory's inheritable ace? `fresh.txt` is the positive control and it must inherit, or the
      # grant failed and `linked.txt` means nothing.
      - name: 'S0 — does a HARDLINK inherit the destination directory ACE?'
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          export MSYS_NO_PATHCONV=1
          rm -rf /c/acltest; mkdir -p /c/acltest/dst /c/acltest/src
          echo hi > /c/acltest/src/orig.txt
          echo "--- grant Guests an INHERITABLE read on dst ---"
          icacls 'C:\acltest\dst' /grant 'Guests:(OI)(CI)(R)'
          echo hi > /c/acltest/dst/fresh.txt
          cmd /c 'mklink /H C:\acltest\dst\linked.txt C:\acltest\src\orig.txt'
          echo; echo "=== fresh.txt (POSITIVE CONTROL — must show an inherited Guests ace) ==="
          icacls 'C:\acltest\dst\fresh.txt'
          echo; echo "=== linked.txt (the hardlink) ==="
          icacls 'C:\acltest\dst\linked.txt'
          echo; echo "--- verdict ---"
          F=$(icacls 'C:\acltest\dst\fresh.txt'  2>/dev/null | grep -c 'Guests')
          L=$(icacls 'C:\acltest\dst\linked.txt' 2>/dev/null | grep -c 'Guests')
          echo "fresh_has_guests_aces=$F  linked_has_guests_aces=$L"
          if [ ! -f /c/acltest/dst/linked.txt ]; then
            echo "S0 INVALID — mklink did not create the hardlink"
          elif [ "$F" -eq 0 ]; then
            echo "S0 INVALID — the positive control did NOT inherit, so the grant never applied"
          elif [ "$L" -eq 0 ]; then
            echo "S0 => PREMISE CONFIRMED: a hardlink does NOT receive the destination dir's inheritable ace"
          else
            echo "S0 => PREMISE REFUTED: the hardlink DID carry the ace"
          fi

      # ── the binary under test ──────────────────────────────────────────────────────────────────
      - name: Resolve the nub commit under test
        shell: bash --noprofile --norc {0}
        run: |
          set -eu
          SHA=$(git ls-remote https://github.com/nubjs/nub.git "$NUB_REF" | cut -f1)
          [ -n "$SHA" ] || { echo "⛔ could not resolve ref $NUB_REF" >&2; exit 1; }
          echo "NUB_SHA=$SHA" >> "$GITHUB_ENV"
          echo "measuring nubjs/nub $NUB_REF @ $SHA"
          P=/tmp/nubsrc/target/fast/nub.exe
          if command -v cygpath >/dev/null 2>&1; then P="$(cygpath -w "$P")"; fi
          echo "NUB_BIN_CACHE_PATH=$P" >> "$GITHUB_ENV"

      # ⛔ EXACT KEY, NO `restore-keys`. A prefix fallback is what makes win-acl-probe unable to
      # measure a new commit: it silently serves an older binary and the run reads as a result.
      - name: Restore a nub built from THIS commit
        id: nubbin
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NUB_BIN_CACHE_PATH }}
          key: nub-jailcopy-v1-windows-${{ env.NUB_SHA }}

      - name: Build nub from the commit under test
        if: steps.nubbin.outputs.cache-matched-key == ''
        shell: bash
        run: |
          set -eux
          git clone --filter=blob:none --no-checkout https://github.com/nubjs/nub.git /tmp/nubsrc
          cd /tmp/nubsrc
          git checkout --detach "$NUB_SHA"
          cargo build -p nub-cli --profile fast --features nub-cli/build-jail-catalog-override

      - name: Save the built binary
        if: steps.nubbin.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NUB_BIN_CACHE_PATH }}
          key: nub-jailcopy-v1-windows-${{ env.NUB_SHA }}

      # ⛔ THE GATE THAT SEPARATES A REAL ARM FROM A VOID ONE, AND IT CHECKS ITSELF FIRST: a
      # malformed catalog must be REJECTED before a well-formed one is allowed to prove the override
      # engaged. A binary that never read the variable at all would otherwise read as success.
      - name: Identify the binary and assert the catalog override is live
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          BIN=/tmp/nubsrc/target/fast/nub.exe
          if [ ! -f "$BIN" ]; then echo "⛔ NO BINARY at $BIN"; echo "NUB_BIN=" >> "$GITHUB_ENV"; exit 1; fi
          echo "commit under test: $NUB_SHA"
          "$BIN" --version
          echo "NUB_BIN=$BIN" >> "$GITHUB_ENV"
          printf '{"packages":{"x":{"default":{"read":"disk","write":"disk"}}}}' > /tmp/cat-bad.json
          printf '{"packages":{"__v2_probe__":{"default":{"network":true}}}}'    > /tmp/cat-good.json
          BAD=$(NUB_BUILD_JAIL_CATALOG=/tmp/cat-bad.json "$BIN" --version 2>&1)
          case "$BAD" in *REJECTED*) echo "control ok — a malformed catalog is refused" ;;
                         *) echo "⛔ GATE IS INERT: ${BAD:-<none>}"; exit 1 ;; esac
          GOOD=$(NUB_BUILD_JAIL_CATALOG=/tmp/cat-good.json "$BIN" --version 2>&1)
          case "$GOOD" in *OVERRIDDEN*) echo "override engages" ;;
                          *) echo "⛔ binary lacks build-jail-catalog-override: ${GOOD:-<none>}"; exit 1 ;; esac

      # ── the three arms ─────────────────────────────────────────────────────────────────────────
      # A0 is the NEGATIVE CONTROL for the discriminator, not a spare arm: jail off ⇒ the override
      # must not engage ⇒ the file must still carry MORE THAN ONE name. Identical in every other
      # respect to A2.
      - name: 'A0 — CONTROL: jail OFF, project-local .store (hardlinks must SURVIVE)'
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          [ -z "$NUB_BIN" ] && { echo "skipped — no binary"; exit 0; }
          D=/c/jail/a0; rm -rf "$D"; mkdir -p "$D"
          node -e '
            const fs=require("fs"); const [p,v]=(process.env.PKG||"").split(/@(?=[^@]*$)/);
            fs.writeFileSync(process.argv[1]+"/package.json", JSON.stringify({name:"a0probe",version:"1.0.0",dependencies:{[p]:v}})+"\n");
            fs.writeFileSync(process.argv[1]+"/nub.jsonc", JSON.stringify({install:{buildJail:false}}));
            fs.writeFileSync(process.argv[1]+"/cat.json", JSON.stringify({packages:{[p]:{default:{write:{deps:true},network:true}}}}));
          ' "$D"
          cd "$D" && NUB_BUILD_JAIL_CATALOG="$D/cat.json" "$NUB_BIN" install > "$D/i.log" 2>&1
          echo "A0_RC=$?" | tee -a "$GITHUB_ENV"
          tail -40 "$D/i.log"

      - name: 'A1 — jail ON, global virtual store'
        shell: bash --noprofile --norc {0}
        env:
          npm_config_enable_global_virtual_store: 'true'
        run: |
          set +e
          [ -z "$NUB_BIN" ] && { echo "skipped — no binary"; exit 0; }
          D=/c/jail/a1; rm -rf "$D"; mkdir -p "$D"
          node -e '
            const fs=require("fs"); const [p,v]=(process.env.PKG||"").split(/@(?=[^@]*$)/);
            fs.writeFileSync(process.argv[1]+"/package.json", JSON.stringify({name:"a1probe",version:"1.0.0",dependencies:{[p]:v}})+"\n");
            fs.writeFileSync(process.argv[1]+"/cat.json", JSON.stringify({packages:{[p]:{default:{write:{deps:true},network:true}}}}));
          ' "$D"
          cd "$D" && NUB_BUILD_JAIL_CATALOG="$D/cat.json" "$NUB_BIN" install > "$D/i.log" 2>&1
          echo "A1_RC=$?" | tee -a "$GITHUB_ENV"
          tail -40 "$D/i.log"

      - name: 'A2 — jail ON, project-local .store'
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          [ -z "$NUB_BIN" ] && { echo "skipped — no binary"; exit 0; }
          D=/c/jail/a2; rm -rf "$D"; mkdir -p "$D"
          node -e '
            const fs=require("fs"); const [p,v]=(process.env.PKG||"").split(/@(?=[^@]*$)/);
            fs.writeFileSync(process.argv[1]+"/package.json", JSON.stringify({name:"a2probe",version:"1.0.0",dependencies:{[p]:v}})+"\n");
            fs.writeFileSync(process.argv[1]+"/cat.json", JSON.stringify({packages:{[p]:{default:{write:{deps:true},network:true}}}}));
          ' "$D"
          cd "$D" && NUB_BUILD_JAIL_CATALOG="$D/cat.json" "$NUB_BIN" install > "$D/i.log" 2>&1
          echo "A2_RC=$?" | tee -a "$GITHUB_ENV"
          tail -40 "$D/i.log"

      # ── forensics + verdict ────────────────────────────────────────────────────────────────────
      # The file the original run was denied on, named by path rather than harvested from an error,
      # because on a PASS there is no error to harvest it from.
      - name: 'F — link counts and ACLs on the previously-denied object'
        if: always()
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          export MSYS_NO_PATHCONV=1
          REL='node_modules/.store/@apollo+rover@0.2.1/node_modules/@apollo/rover/install.js'
          for A in a0 a1 a2; do
            D=/c/jail/$A
            [ -d "$D" ] || continue
            echo "════════════════════════ $A ════════════════════════"
            grep -h 'linker ' "$D/i.log" 2>/dev/null
            U="$D/$REL"
            if [ ! -f "$U" ]; then echo "names_$A=absent (the file was never materialized)"; continue; fi
            P=$(cygpath -w "$U")
            echo "--- icacls ---"; icacls "$P"
            echo "--- fsutil hardlink list ---"; fsutil hardlink list "$P"
            N=$(fsutil hardlink list "$P" 2>/dev/null | grep -c '[^[:space:]]')
            echo "names_$A=$N"
            echo "NAMES_$(echo $A | tr a-z A-Z)=$N" >> "$GITHUB_ENV"
          done

      - name: Verdict
        if: always()
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          echo "commit under test: ${NUB_SHA:-?}"
          echo "A0 (control, jail OFF)          rc=${A0_RC:-?}  names=${NAMES_A0:-?}"
          echo "A1 (jail ON, global vstore)     rc=${A1_RC:-?}  names=${NAMES_A1:-?}"
          echo "A2 (jail ON, project .store)    rc=${A2_RC:-?}  names=${NAMES_A2:-?}"
          for A in a0 a1 a2; do
            printf '%s first error: %s\n' "$A" "$(grep -m1 -E 'EPERM|EACCES|Error:' /c/jail/$A/i.log 2>/dev/null)"
          done
          echo
          if [ "${NAMES_A0:-1}" -le 1 ]; then
            echo "⛔ VOID — the control arm shows ${NAMES_A0:-?} name(s) with the jail OFF, so the link"
            echo "   count cannot distinguish copy from hardlink here and the arms below prove nothing."
            exit 1
          fi
          echo "control ok — jail OFF still hardlinks (${NAMES_A0} names)"
          if [ "${A1_RC:-1}" = 0 ] && [ "${A2_RC:-1}" = 0 ] && [ "${NAMES_A1:-9}" = 1 ] && [ "${NAMES_A2:-9}" = 1 ]; then
            echo "PASS — both jailed arms installed AND their store files are private copies."
          else
            echo "FAIL — read the arm logs above; rc and link count must BOTH be right."
            exit 1
          fi

      - name: Preserve the arm logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-jail-copy-verify-${{ github.run_id }}
          path: |
            C:/jail/**/*.log
            C:/jail/**/cat.json
            C:/jail/**/nub.jsonc
          if-no-files-found: warn
          retention-days: 14
