# The macOS lane of the v2 measurement loop: OBSERVE unjailed under dtrace -> SYNTHESIZE the
# narrowest grant -> VERIFY it in the real unprivileged build jail -> NARROW it to measure
# over-prediction directly.
#
# Branch-scoped and no PR: both tracers need uid 0, and the maintainer's Mac is not a place to run
# `sudo`. A hosted runner reports SIP DISABLED, which is what makes dtrace work here and nowhere
# locally.
name: macos-v2-measure

on:
  push:
    branches: [probe/macos-v2-measure]
  workflow_dispatch:
    inputs:
      packages:
        description: 'space-separated pkg@version list'
        required: false
        default: '@apollo/rover@0.2.1'

permissions:
  contents: read

# The proof run for the eviction port. The driver's own guard is what makes the lane inert until an
# arm that MUST fail at a too-narrow grant has been seen to fail on a real runner; this sets it for
# exactly that run, and both the variable and the guard go away in the lifting commit.
env:
  NUB_V2_MACOS_EVICTION_VERIFIED: 1

jobs:
  measure:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Host facts + dtrace gate
        run: |
          set +e
          sw_vers; uname -m; node --version; npm --version
          echo "SIP-VERBATIM: $(csrutil status 2>&1)"
          echo "bash: $(/bin/bash --version | head -1)"
          echo "cmake: $(command -v cmake || echo MISSING)"
          sudo dtrace -n 'BEGIN { trace("hello"); exit(0); }' 2>&1
          echo "HELLO_RC=$?"

      # Any cached probe binary from the corpus queue runner will do: the VERIFY arm needs the
      # `build-jail-catalog-override` feature, not a specific commit, and the arm records which
      # binary answered. A prefix restore-key is therefore correct and a miss is merely slower.
      - name: Restore a feature-enabled nub binary
        id: nubbin
        uses: actions/cache/restore@v4
        with:
          path: /tmp/nub/target/release/nub
          key: nub-bin-v1-macos-none
          restore-keys: |
            nub-bin-v1-macos-

      - name: Start the fallback build in the background
        if: steps.nubbin.outputs.cache-matched-key == ''
        run: |
          set +e
          command -v cmake > /dev/null || brew install cmake
          git clone --filter=blob:none --depth 1 -b sandbox/integration \
            https://github.com/nubjs/nub.git /tmp/nubsrc 2>&1 | tail -2
          echo "nub sha: $(git -C /tmp/nubsrc rev-parse HEAD)"
          # `--profile fast` rather than `--release`: identical semantics for this purpose (fast
          # inherits dev) and it does not pay for LTO, which is the difference between fitting in
          # the job and not. Backgrounded so the OBSERVE pass below runs while it compiles —
          # OBSERVE needs no nub at all, and it is the half that must land no matter what.
          cd /tmp/nubsrc
          nohup cargo build -p nub-cli --profile fast \
            --features nub-cli/build-jail-catalog-override > /tmp/build.log 2>&1 &
          echo "build pid $!"

      # ⛔ RUN OBSERVE FIRST AND UNCONDITIONALLY. It needs no nub binary, and the macOS lane has
      # never produced a single end-to-end result — so the observation half is banked before the
      # build is allowed to become a way to lose it. The driver refuses to fabricate a verdict
      # without a feature-enabled binary; it prints OBSERVE-ONLY and says the grant is a hypothesis.
      - name: OBSERVE + SYNTHESIZE (no jail, no nub)
        continue-on-error: true
        run: |
          set +e
          chmod +x harness/v2/measure-macos.sh
          for spec in ${{ github.event.inputs.packages || '@apollo/rover@0.2.1' }}; do
            P="${spec%@*}"; V="${spec##*@}"
            echo "=================================================================="
            sudo -E harness/v2/measure-macos.sh "$P" "$V" 2>&1 | tee -a /tmp/observe.txt
            echo "PIPESTATUS=${PIPESTATUS[0]}"
          done

      - name: Wait for the build, then locate the binary
        if: always()
        run: |
          set +e
          BIN=/tmp/nub/target/release/nub
          if [ ! -x "$BIN" ]; then
            BIN=/tmp/nubsrc/target/fast/nub
            for i in $(seq 1 60); do
              [ -x "$BIN" ] && ! pgrep -q -f 'cargo build -p nub-cli' && break
              sleep 30
            done
            tail -5 /tmp/build.log 2>/dev/null
          fi
          if [ -x "$BIN" ]; then
            echo "NUB_BIN=$BIN" >> "$GITHUB_ENV"
            echo "binary: $BIN"; "$BIN" --version
            shasum -a 256 "$BIN"
          else
            echo "⛔ NO FEATURE-ENABLED BINARY — VERIFY cannot run; the OBSERVE half above stands alone"
          fi

      - name: VERIFY + NARROW (real unprivileged jail)
        if: always()
        continue-on-error: true
        run: |
          set +e
          [ -n "${NUB_BIN:-}" ] || { echo "skipped: no binary"; exit 0; }
          for spec in ${{ github.event.inputs.packages || '@apollo/rover@0.2.1' }}; do
            P="${spec%@*}"; V="${spec##*@}"
            echo "=================================================================="
            sudo -E harness/v2/measure-macos.sh "$P" "$V" "$NUB_BIN" 2>&1 | tee -a /tmp/verify.txt
          done

      # ⛔ THE FAILING CONTROL, AND IT IS THE HALF THAT MAKES THE PASS ABOVE EVIDENCE. A negative
      # control that fails proves nothing unless the same fixture PASSES once the guards are removed
      # — otherwise the failure may be incidental to macOS. This is the PRE-FIX driver: eviction and
      # memo drop both neutered, everything else identical, on a store this job has already warmed.
      # Expected: the too-narrow `{"network":true}` arm relinks a built `binary-install`, never runs
      # the script, and comes back OVER-PREDICTED — the under-grant the lane's guard describes.
      - name: Failing control — the pre-fix driver on the same fixture
        if: always()
        continue-on-error: true
        run: |
          set +e
          [ -n "${NUB_BIN:-}" ] || { echo "skipped: no binary"; exit 0; }
          cp harness/v2/measure-macos.sh harness/v2/prefix.sh
          sed -i '' 's|^  if \[ -d "$STORE" \]; then|  if false; then|' harness/v2/prefix.sh
          sed -i '' "s|^  printf 'side-effects-cache=false.*|  : # memo drop neutered|" harness/v2/prefix.sh
          n=$(grep -c '^  if false; then' harness/v2/prefix.sh)
          m=$(grep -c '^  : # memo drop neutered' harness/v2/prefix.sh)
          echo "neuter applied: eviction=$n memo=$m (both must be 1)"
          [ "$n" = 1 ] && [ "$m" = 1 ] || {
            echo "⛔ THE NEUTER DID NOT APPLY — this control is VOID, not a pass"; exit 0; }
          chmod +x harness/v2/prefix.sh
          sudo -E harness/v2/prefix.sh @apollo/rover 0.2.1 "$NUB_BIN" 2>&1 | tee -a /tmp/noevict.txt

      # ⛔ DOES THE EVICTION HAVE ANYTHING TO EVICT? Windows measured `global virtual store
      # auto-disabled in CI`, which relocates every arm into a project-local `node_modules/.store`
      # and makes the sweep a silent no-op — arms independent by accident. The macOS EVICT counters
      # say otherwise; this asserts it directly rather than inferring it from a count.
      - name: Layout diagnostic — is the machine-global store live on this runner?
        if: always()
        continue-on-error: true
        run: |
          set +e
          echo "store entries before: $(ls ~/.cache/nub/pm/store 2>/dev/null | wc -l)"
          rm -rf /tmp/lay && mkdir -p /tmp/lay && cd /tmp/lay
          printf '{"name":"lay","version":"1.0.0","dependencies":{"@apollo/rover":"0.2.1"}}\n' > package.json
          printf '{"install":{"buildJail":true}}\n' > nub.jsonc
          "$NUB_BIN" install > i.log 2>&1; echo "install rc=$?"
          grep -iE "linker|virtual store" i.log
          echo "--- where does node_modules/@apollo/rover point? ---"
          ls -l node_modules/@apollo/ 2>/dev/null
          python3 -c "import os;print('realpath:', os.path.realpath('node_modules/@apollo/rover'))" 2>/dev/null
          echo "project-local .store entries: $(ls node_modules/.store 2>/dev/null | wc -l)"
          echo "store entries after: $(ls ~/.cache/nub/pm/store 2>/dev/null | wc -l)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-v2-measure
          path: |
            /tmp/observe.txt
            /tmp/verify.txt
            /tmp/build.log
            /tmp/noevict.txt
          if-no-files-found: warn
