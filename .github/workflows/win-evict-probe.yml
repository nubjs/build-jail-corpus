# The proof for the Windows driver's per-arm store eviction: R0 primes, R2 must refuse a too-narrow
# grant, R3 must still accept the true minimum, P checks the tooling sparing survives.
#
# ⛔⛔ THE R1 "TEETH CONTROL" WAS RETIRED 2026-08-07 AFTER BEING MEASURED NON-DISCRIMINATING HERE.
# Recorded so nobody re-derives it as an oversight and adds it back.
#
# R1 drove a copy of the driver mutated back to ROOT-ONLY eviction and REQUIRED a false PASS, so that
# deep eviction could be shown to be the thing preventing one. It never produced that false pass.
# MEASURED on two venues — run 31132145179 on `windows-latest`, and the same rows re-run on the
# corpus VM — R1 and R2 came back IDENTICAL at `rc=1 artifacts=6/6 missing=0`, differing only in
# `EVICT 1` vs `EVICT 30`.
#
# The reason is mechanical, not a gap in the experiment, and no amount of retrying or of picking
# another package could fix it: both arms fail on a WRITE refused at the grant boundary
# (`EPERM … mkdir …\binary-install@0.1.1-<hash>\…\bin`), and that refusal fires whether or not the
# entry was evicted. Eviction DEPTH is therefore not the discriminating variable on win32, so the
# experiment has no positive control available to it. A control that cannot distinguish its two arms
# proves nothing about either, and keeping it would have meant gating win32 records on a check that
# was structurally incapable of failing — the exact defect class this corpus keeps finding.
#
# ⇒ WHAT REPLACED IT. The question worth answering was never "is deep eviction load-bearing" but
# "can the win32 verify arm detect an under-grant", and `falsify.mjs` answers that directly, from
# measured arms rather than a synthetic eviction manipulation, on the same instrument Linux and macOS
# use. The win32 case there is grounded on rows R0/R3 and R1/R2 of this very run.
#
# ⛔ AND THE VERDICT USED TO BE UNABLE TO FAIL ON R1. The R1 check was an `echo`'d `!!` warning with
# no `FAIL=1`, so a GREEN run never meant the criterion had been met — while run 31132145179 was
# simultaneously marked RED by an unrelated apostrophe in a later step. The badge inverted in both
# directions at once. Every remaining row below sets `FAIL=1`; keep it that way.
#
# Branch-scoped and no PR: CI is the only Windows path here, and `workflow_dispatch` is inert until a
# workflow file reaches the default branch, so a push trigger is the only way to iterate on this one.
#
# ⛔ SEQUENTIAL, AND THE ROW ORDER IS LOAD-BEARING. Four concurrent Windows workers were measured to
# stall at process creation with zero writes, and R2/R3 are only meaningful once R0 has left
# `binary-install`'s store entry POPULATED.
name: win-evict-probe

on:
  push:
    branches: [probe/win-evict]
  workflow_dispatch:
    inputs:
      pkg:
        description: 'the transitive-write package for the negative control'
        default: '@apollo/rover@0.2.1'
      gyp_pkg:
        description: 'the node-gyp-tooling package for the positive control'
        default: '@pulumi/datadog@0.18.9'
      nub_ref:
        description: 'nubjs/nub ref to build and measure'
        default: 'sandbox/integration'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PKG: ${{ inputs.pkg || '@apollo/rover@0.2.1' }}
      GYP_PKG: ${{ inputs.gyp_pkg || '@pulumi/datadog@0.18.9' }}
      # ⛔ THE REF IS AN INPUT AND THE RESOLVED SHA IS PRINTED, because "which nub did this measure"
      # is the question a stale cache answers wrongly and silently. Defaulting to the branch rather
      # than to a SHA keeps the probe pointed at the code the corpus lane would actually ship on.
      NUB_REF: ${{ inputs.nub_ref || 'sandbox/integration' }}
      # ⛔⛔ WITHOUT THIS THE EXPERIMENT MEASURES NOTHING, AND IT LOOKS FINE WHILE DOING SO. MEASURED
      # in run 31106248877: every arm logged `linker isolated (global virtual store auto-disabled in
      # CI)` and put its `.store` INSIDE the arm directory, so `%LOCALAPPDATA%\nub\pm\store` never
      # existed, the eviction skipped in silence, and root-only and transitive eviction were
      # indistinguishable — four arms, identical verdicts, zero EVICT lines. `is_ci()` picks the
      # project-local layout (`install_report.rs` `layout_row`), and an explicit
      # `enableGlobalVirtualStore` is the one thing checked BEFORE it. A real user is not in CI, so
      # forcing it on is also what makes the arm resemble the install being measured.
      npm_config_enable_global_virtual_store: 'true'
      # The sanctioned use of the driver's guard, and the ONLY one: this workflow is the proof the
      # guard is waiting on, so it has to be able to run the driver. Setting it anywhere else — in
      # the corpus lane, in a sweep — publishes rows the guard exists to stop.
      NUB_V2_WINDOWS_EVICTION_VERIFIED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Host facts
        shell: bash
        run: |
          set +e
          node --version; npm --version
          echo "LOCALAPPDATA=$LOCALAPPDATA"
          echo "XDG_CACHE_HOME=${XDG_CACHE_HOME:-<unset>}"
          powershell.exe -NoProfile -Command 'whoami'

      # ⛔⛔ THE CACHE IS KEYED ON THE RESOLVED SHA WITH NO `restore-keys` PREFIX, AND THAT IS THE
      # DIFFERENCE BETWEEN A RESULT AND A FICTION. This step used to key `nub-bin-v1-windows-none`
      # behind a `nub-bin-v1-windows-` prefix fallback, which matches whatever binary the corpus
      # fleet cached LAST. MEASURED 2026-08-06 with `gh cache list`: the newest such entry is
      # `nub-bin-v1-windows-bb9a1036…`, saved 07:33Z — fourteen hours BEFORE `4bd4687521`, the
      # hardlink fix every jailed arm below now depends on. Run unchanged, this workflow would have
      # restored a PRE-FIX binary, watched every arm die on the very EPERM that fix removes, and
      # filed it as the eviction's verdict. `win-jail-copy-verify.yml` reached the same conclusion
      # about `win-acl-probe`; the prefix fallback is a repeat offender in this repo.
      - name: Resolve the nub commit under test
        shell: bash
        run: |
          set -eu
          SHA=$(git ls-remote https://github.com/nubjs/nub.git "$NUB_REF" | cut -f1)
          [ -n "$SHA" ] || { echo "⛔ could not resolve ref $NUB_REF" >&2; exit 1; }
          echo "NUB_SHA=$SHA" >> "$GITHUB_ENV"
          echo "measuring nubjs/nub $NUB_REF @ $SHA"
          P=/tmp/nubsrc/target/fast/nub.exe
          if command -v cygpath >/dev/null 2>&1; then P="$(cygpath -w "$P")"; fi
          echo "NUB_BIN_CACHE_PATH=$P" >> "$GITHUB_ENV"

      - name: Restore a nub built from THIS commit
        id: nubbin
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NUB_BIN_CACHE_PATH }}
          key: nub-jailcopy-v1-windows-${{ env.NUB_SHA }}

      - name: Build the probe binary
        if: steps.nubbin.outputs.cache-matched-key == ''
        shell: bash
        run: |
          set -eux
          git clone --filter=blob:none --no-checkout https://github.com/nubjs/nub.git /tmp/nubsrc
          cd /tmp/nubsrc
          git checkout --detach "$NUB_SHA"
          cargo build -p nub-cli --profile fast --features nub-cli/build-jail-catalog-override

      - name: Save the built binary
        if: steps.nubbin.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NUB_BIN_CACHE_PATH }}
          key: nub-jailcopy-v1-windows-${{ env.NUB_SHA }}

      - name: Name the binary under test
        shell: bash
        run: |
          set -eu
          BIN=/tmp/nubsrc/target/fast/nub.exe
          [ -f "$BIN" ] || { echo "⛔ NO BINARY at $BIN" >&2; exit 1; }
          echo "commit under test: $NUB_SHA"
          "$BIN" --version
          echo "NUB_BIN=$BIN" >> "$GITHUB_ENV"

      # ⛔ THE CHECK THAT SEPARATES A REAL ARM FROM A VOID ONE, AND IT CHECKS ITSELF FIRST. A
      # malformed catalog must be REJECTED before a well-formed one is allowed to prove anything —
      # without that control, a binary that never read the variable at all reads as success.
      - name: Assert the binary honours NUB_BUILD_JAIL_CATALOG
        shell: bash
        run: |
          set +e
          printf '{"packages":{"x":{"default":{"read":"disk","write":"disk"}}}}' > /tmp/cat-bad.json
          printf '{"packages":{"__v2_probe__":{"default":{"network":true}}}}'    > /tmp/cat-good.json
          BAD=$(NUB_BUILD_JAIL_CATALOG=/tmp/cat-bad.json "$NUB_BIN" --version 2>&1)
          case "$BAD" in
            *REJECTED*) echo "control ok — a malformed catalog is refused" ;;
            *) echo "⛔ GATE IS INERT. Saw: ${BAD:-<none>}" >&2; exit 1 ;;
          esac
          GOOD=$(NUB_BUILD_JAIL_CATALOG=/tmp/cat-good.json "$NUB_BIN" --version 2>&1)
          case "$GOOD" in
            *OVERRIDDEN*) echo "override engages: $GOOD" ;;
            *) echo "⛔ no OVERRIDDEN banner — this binary lacks build-jail-catalog-override. Saw: ${GOOD:-<none>}" >&2; exit 1 ;;
          esac

      - name: R0 — prime the store at the wide grant
        shell: bash
        run: |
          set +e
          node harness/v2/measure-windows.mjs "${PKG%@*}" "${PKG##*@}" --nub "$NUB_BIN" \
            --at-grant '{"write":{"deps":true},"network":true}' > /tmp/r0.log 2>&1
          echo "R0_EXIT=$?" >> "$GITHUB_ENV"
          cat /tmp/r0.log

      # The eviction's precondition, checked directly rather than inferred from a verdict: if the
      # global store does not exist, every row below is measuring the CI layout and proves nothing.
      - name: Assert the arms actually used the global virtual store
        shell: bash
        run: |
          set +e
          grep -h "linker " /c/jail/*/verify-*/i.log | sort -u
          node -e '
            const fs = require("fs"), path = require("path");
            const s = path.join(process.env.XDG_CACHE_HOME || process.env.LOCALAPPDATA, "nub", "pm", "store");
            const n = fs.existsSync(s) ? fs.readdirSync(s).length : -1;
            console.log(`store=${s} entries=${n}`);
            if (n < 1) { console.error("⛔ the global store is empty or absent — the eviction has nothing to act on and the experiment is INERT"); process.exit(1); }
          '

      - name: R2 — THE NEGATIVE CONTROL (transitive eviction; must be INSUFFICIENT)
        shell: bash
        run: |
          set +e
          node harness/v2/measure-windows.mjs "${PKG%@*}" "${PKG##*@}" --nub "$NUB_BIN" \
            --at-grant '{"network":true}' > /tmp/r2.log 2>&1
          echo "R2_EXIT=$?" >> "$GITHUB_ENV"
          cat /tmp/r2.log

      - name: R3 — the true minimum still verifies
        shell: bash
        run: |
          set +e
          node harness/v2/measure-windows.mjs "${PKG%@*}" "${PKG##*@}" --nub "$NUB_BIN" \
            --at-grant '{"write":{"deps":true},"network":true}' > /tmp/r3.log 2>&1
          echo "R3_EXIT=$?" >> "$GITHUB_ENV"
          cat /tmp/r3.log

      - name: P — the positive control, full pipeline on a node-gyp-tooling package
        shell: bash
        run: |
          set +e
          # `--synth-only`: the positive control asks whether the tooling survives the eviction, not
          # what this package's minimum is, and the ladder costs three more full installs to answer
          # a question nobody asked here.
          node harness/v2/measure-windows.mjs "${GYP_PKG%@*}" "${GYP_PKG##*@}" --nub "$NUB_BIN" --synth-only \
            > /tmp/p.log 2>&1
          echo "P_EXIT=$?" >> "$GITHUB_ENV"
          cat /tmp/p.log
          echo "--- 'Cannot find module' across every arm log on disk ---"
          grep -rn "Cannot find module" /c/jail 2>/dev/null | head -20 || echo "none"

      # Re-verifies on THIS platform the claim 67c01911 measured on Linux: every store entry nub's own
      # tool projects link through declares no lifecycle script, so sparing one cannot carry a prior
      # arm's build output into a later arm. Run AFTER the arms, when the tool project exists because
      # a real jailed install provisioned it.
      - name: Enumerate what the eviction spares, and whether any of it builds
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/gypboot && cd /tmp/gypboot && printf '{"name":"b","version":"1.0.0"}\n' > package.json
          "$NUB_BIN" __node-gyp-bootstrap . 2>&1 | tail -3
          node -e '
            const fs = require("fs"), path = require("path");
            const cache = path.join(process.env.XDG_CACHE_HOME || process.env.LOCALAPPDATA, "nub", "pm");
            const store = path.join(cache, "store"), tools = path.join(cache, "tools");
            console.log(`store=${store} exists=${fs.existsSync(store)}`);
            console.log(`tools=${tools} exists=${fs.existsSync(tools)}`);
            if (!fs.existsSync(tools)) { console.log("!! no tools dir — the sparing claim is UNVERIFIED on this platform"); process.exit(0); }
            let storeReal; try { storeReal = fs.realpathSync(store); } catch { storeReal = store; }
            const keep = new Set();
            (function walk(d, depth) {
              if (depth > 6) return;
              let ents; try { ents = fs.readdirSync(d, { withFileTypes: true }); } catch { return; }
              for (const e of ents) {
                const p = path.join(d, e.name);
                let t; try { t = fs.realpathSync(p); } catch { continue; }
                const rel = path.relative(storeReal, t);
                if (rel && !rel.startsWith("..") && !path.isAbsolute(rel)) { keep.add(rel.split(path.sep)[0]); continue; }
                let st; try { st = fs.statSync(p); } catch { continue; }
                if (st.isDirectory()) walk(p, depth + 1);
              }
            })(tools, 0);
            console.log(`tool closure: ${keep.size} store entries`);
            let withScripts = 0, unread = 0;
            for (const e of [...keep].sort()) {
              // The entry name is NOT always `<name>@<version>-<hash>`: a peer-dependency-keyed entry
              // is `fdir@6.5.0_picomatch@4.0.5_-<hash>`, so de-mangling the name off it reports a
              // false "unreadable" — which reads as a hole in the zero-lifecycle-scripts claim.
              // Enumerate the node_modules inside that entry instead of reconstructing the name.
              //
              // NO APOSTROPHES ANYWHERE IN THIS PROGRAM. It is the body of a `node -e ...` single-
              // quoted shell string, so one quote — including one in a COMMENT — closes it early.
              // This line read "the entry" + apostrophe + "s own node_modules" and cost run
              // 31132145179 the whole step: node reported `SyntaxError: Unexpected end of input`
              // because the program was truncated there, bash then failed on the NEXT line with
              // `syntax error near unexpected token (`, and the JOB went red. Nothing about the
              // eviction was wrong; the Verdict step right after it passed. So the red job was
              // reporting a quoting bug in prose while the measurement it gates read green — and a
              // reader who trusts the job conclusion learns the opposite of what the run measured.
              const cands = [path.join(store, e, "package.json")];
              const nm = path.join(store, e, "node_modules");
              for (const d of (fs.existsSync(nm) ? fs.readdirSync(nm) : [])) {
                if (d.startsWith("@")) for (const t of fs.readdirSync(path.join(nm, d))) cands.push(path.join(nm, d, t, "package.json"));
                else cands.push(path.join(nm, d, "package.json"));
              }
              let s = null;
              for (const c of cands) { try { s = JSON.parse(fs.readFileSync(c, "utf8")).scripts ?? {}; break; } catch {} }
              if (s === null) { unread++; console.log(`  ?? ${e} — no readable package.json`); continue; }
              const life = ["preinstall", "install", "postinstall"].filter((k) => s[k]);
              if (life.length) { withScripts++; console.log(`  DECLARES ${life.join(",")}: ${e}`); }
              else console.log(`  ok ${e}`);
            }
            console.log(withScripts === 0 && unread === 0
              ? "=> zero lifecycle scripts across the spared closure — sparing cannot carry build output"
              : `=> ${withScripts} spared entries declare a lifecycle script, ${unread} unreadable — the sparing rationale needs re-examining`);
          '

      # ⛔ READS THE LOGS, NOT THE EXIT CODES ALONE. An arm exits non-zero for reasons that have
      # nothing to do with the grant — VOID, a timeout, a broken tool — and every one of those is
      # otherwise indistinguishable from the INSUFFICIENT this control is looking for.
      - name: Verdict
        if: always()
        shell: bash
        run: |
          set +e
          for r in R0 R2 R3 P; do
            v="${r}_EXIT"; f="/tmp/$(echo "$r" | tr A-Z a-z).log"
            printf '%-3s exit=%-4s %s\n' "$r" "${!v:-?}" "$(grep -E '=> ' "$f" 2>/dev/null | tail -1 | sed 's/^ *//')"
          done
          echo; echo "EVICT lines:"; grep -h "EVICT " /tmp/r*.log /tmp/p.log 2>/dev/null
          echo; echo "CLOSURE lines:"; grep -h "CLOSURE " /tmp/r*.log /tmp/p.log 2>/dev/null
          echo; echo "arm layouts:"; grep -h "linker " /c/jail/*/verify-*/i.log 2>/dev/null | sort | uniq -c
          echo; echo "arm failures (first line of each):"
          for f in /c/jail/*/verify-*/i.log; do
            printf '%s: %s\n' "$(basename "$(dirname "$(dirname "$f")")")/$(basename "$(dirname "$f")")" \
              "$(grep -m1 -E 'EPERM|EACCES|Error:|lifecycle script' "$f" 2>/dev/null)"
          done
          echo
          FAIL=0
          grep -q '=> SUFFICIENT' /tmp/r0.log   || { echo "⛔ R0 did not prime (expected SUFFICIENT)"; FAIL=1; }
          grep -q '=> INSUFFICIENT' /tmp/r2.log || { echo "⛔ R2 IS THE DELIVERABLE AND IT DID NOT FAIL — the eviction does not stop the replay"; FAIL=1; }
          grep -q '=> SUFFICIENT' /tmp/r3.log   || { echo "⛔ R3 did not verify at the true minimum — the eviction may be over-broad"; FAIL=1; }
          if grep -q "Cannot find module" /tmp/p.log; then echo "⛔ positive control hit a missing module — the tooling sparing did not hold"; FAIL=1; fi
          exit $FAIL

      - name: Preserve the arm logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-evict-probe-${{ github.run_id }}
          path: |
            C:/jail/**/*.log
            C:/jail/**/observed.*
            C:/jail/**/cat.json
          if-no-files-found: warn
          retention-days: 14
