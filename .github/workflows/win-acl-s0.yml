# The nub-free half of the Windows read-denial diagnosis, kept deliberately minimal.
#
# Two jobs in one: it answers the C2 premise (does a hard link pick up the destination
# directory's inheritable ACE?), and — because it shares a branch with win-acl-probe.yml and
# uses none of that file's machinery — it also tells us whether a workflow on this branch
# registers at all. win-acl-probe.yml produced no run and no github-actions check suite on two
# pushes, which is the signature of a file GitHub declined rather than a trigger that missed.
#
# `fresh.txt` is the POSITIVE CONTROL and the step is worthless without it: it is created
# normally inside the same granted directory, so it MUST come back carrying the inherited ace.
# If it does not, the grant itself never applied and the hardlink result proves nothing.
name: win-acl-s0

on:
  push:
    branches: [probe/win-acl]

permissions:
  contents: read

jobs:
  s0:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Does a hardlink inherit the destination directory ACE
        shell: bash
        run: |
          set +e
          rm -rf /c/acltest
          mkdir -p /c/acltest/dst /c/acltest/src
          echo hi > /c/acltest/src/orig.txt
          echo "--- grant Guests an INHERITABLE read on dst ---"
          icacls 'C:\acltest\dst' /grant 'Guests:(OI)(CI)(R)'
          echo hi > /c/acltest/dst/fresh.txt
          cmd /c 'mklink /H C:\acltest\dst\linked.txt C:\acltest\src\orig.txt'
          echo ""
          echo "=== fresh.txt (POSITIVE CONTROL - must show an inherited Guests ace) ==="
          icacls 'C:\acltest\dst\fresh.txt'
          echo ""
          echo "=== linked.txt (the hardlink) ==="
          icacls 'C:\acltest\dst\linked.txt'
          echo ""
          echo "=== src orig.txt (the same file object, other name) ==="
          icacls 'C:\acltest\src\orig.txt'
          echo ""
          F=$(icacls 'C:\acltest\dst\fresh.txt' 2>/dev/null | grep -c Guests)
          L=$(icacls 'C:\acltest\dst\linked.txt' 2>/dev/null | grep -c Guests)
          echo "fresh_has_guests_aces=$F linked_has_guests_aces=$L"
          if [ "$F" -eq 0 ]; then
            echo "S0 INVALID - the positive control did NOT inherit, so the grant never applied"
          elif [ "$L" -eq 0 ]; then
            echo "S0 RESULT C2 PREMISE CONFIRMED - a hardlink does NOT receive the destination directory inheritable ace"
          else
            echo "S0 RESULT C2 PREMISE REFUTED - the hardlink DID carry the ace"
          fi
          exit 0
