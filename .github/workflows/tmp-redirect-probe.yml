# Does a write to the jail's temp dir need a write grant, or is `outside` on those paths an
# artifact of OBSERVE running unjailed?
#
# THE SETUP. `observe.mjs` buckets any write under no catalog-expressible scope as `outside`. On the
# 45 linux-x64 v2 records, 10 carry that flag and every listed path is under `/tmp`. OBSERVE is the
# UNJAILED arm, so its `os.tmpdir()` is the real shared `/tmp`; the jailed arm's is not, because
# `build_jail_surface` inserts `$tmp: rw` (`compiler/preset.rs`) = `TmpMode::Private`, which
# `backend/linux.rs` implements as bubblewrap `--bind <per-run-dir> /tmp` + `insert_tmp_env(…,"/tmp")`.
#
# ⛔ THIS RUNS TWO INSTRUMENTS, NOT ONE, BECAUSE THEY ANSWER DIFFERENT QUESTIONS AND THE SECOND IS
# THE ONE THAT CAN EMBARRASS THE FIRST.
#
#   FIXTURE  a synthetic package with four independent write targets and a KNOWN answer for two of
#            them. It isolates the temp axis with no download, no network and no toolchain, and it
#            carries its own negative controls — a real-home write and a `/var/tmp` write that MUST
#            be refused. Without those, "the temp write succeeded" is equally consistent with the
#            jail never engaging.
#   REAL     `measure.sh --at-grant` on corpus packages, which is where a mechanism that is true in
#            isolation gets to be irrelevant in practice. `playwright-chromium@0.17.0` is the case
#            the hypothesis names: one `/tmp` write, and a recorded MINIMUM of
#            `{"write":{deps,project,userHome},"network":true}` reached by ladder fallback.
#
# ⛔ THE `read:"disk"` ARM IS THE POINT OF THE REAL HALF, AND THE LADDER CANNOT ASK IT. The v2
# fallback ladder's FIRST rung is already `{"write":{deps,project,userHome},"network":true}` — there
# is no `deps`-alone or `project`-alone rung — so ANY synth failure lands on the widest write grant
# regardless of cause. `{"read":"disk","network":true}` widens READS ONLY. If the package passes
# there, its recorded write grant was never earned and the cause was never a write at all.
#
# Linux only, on purpose: the redirect is a bind MOUNT here and an env redirect plus SBPL denies on
# macOS, so the hardcoded-`/tmp` row is expected to diverge and needs its own run to say so.

name: tmp-redirect-probe

on:
  push:
    branches: [probe/tmp-redirect]
  workflow_dispatch:
    inputs:
      at_grant_specs:
        description: "space-separated pkg@version:grant-json triples for the --at-grant arms"
        type: string
        default: ""

concurrency:
  group: tmp-redirect-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install strace and prove it traces
        shell: bash
        run: |
          set -eux
          sudo apt-get update -qq && sudo apt-get install -y -qq strace
          strace -f -o /tmp/strace-control.txt /bin/true
          grep -q execve /tmp/strace-control.txt

      - name: Resolve the native path of the probe binary
        shell: bash
        run: echo "NUB_BIN_CACHE_PATH=/tmp/nub/target/release/nub" >> "$GITHUB_ENV"

      # ⛔⛔ THIS USED TO ARGUE "ANY CACHED CORPUS-PROBE BINARY WILL DO — the arm needs the FEATURE,
      # not a commit — so a prefix restore-key is correct and a miss is merely slower." Both halves
      # are false and `corpus-v2-runner.yml` has already paid for it. MEASURED, run 31145732202: the
      # prefix fallback served a binary created 2026-08-06T07:33:54Z, ~13.5 h older than the jail fix
      # `4bd4687521` (2026-08-06T21:04:55Z) the run existed to exercise; every arm died on the
      # pre-fix behaviour and the whole run was unattributable. A correctness fix is not a feature
      # flag, so a binary that HAS the feature can still be the wrong binary.
      #
      # ⛔ AND THE EXACT KEY HERE COULD NEVER MATCH ANYTHING. It was the literal `nub-bin-v1-linux-`
      # — the prefix itself — while every real save is `nub-bin-v1-linux-<sha>`. So the fallback was
      # not a fallback at all; it was the only path this step ever took.
      #
      # ⛔ THE SHA IS RESOLVED BEFORE THE RESTORE, NOT INSIDE THE BUILD. The build runs only on a
      # MISS, so on a HIT `NUB_GIT_SHA` was never set and nothing recorded which commit answered.
      - name: Resolve the nub commit under test
        shell: bash
        run: |
          set -eu
          REF=sandbox/integration
          # `git ls-remote` rather than a clone: the key is needed before the restore, and the clone
          # below reuses this answer instead of resolving a second time and risking a different one.
          SHA=$(git ls-remote https://github.com/nubjs/nub.git "$REF" | cut -f1)
          [ -n "$SHA" ] || { echo "⛔ could not resolve nub ref '$REF'" >&2; exit 1; }
          echo "NUB_GIT_SHA=$SHA" >> "$GITHUB_ENV"
          echo "nub commit under test: $REF -> $SHA"

      - name: Restore a feature-enabled nub binary
        id: nubbin
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NUB_BIN_CACHE_PATH }}
          key: nub-bin-v1-linux-${{ env.NUB_GIT_SHA }}

      - name: Build the probe binary
        if: steps.nubbin.outputs.cache-matched-key == ''
        shell: bash
        run: |
          set -eux
          git clone --filter=blob:none --no-checkout https://github.com/nubjs/nub.git /tmp/nubsrc
          cd /tmp/nubsrc
          # Already resolved above, on both the hit and miss paths, so the binary cannot be built
          # from a different commit than the key it is saved under names.
          git checkout --detach "$NUB_GIT_SHA"
          cargo build -p nub-cli --profile fast --features nub-cli/build-jail-catalog-override
          echo "NUB_BIN=/tmp/nubsrc/target/fast/nub" >> "$GITHUB_ENV"
          # Staged at the path the cache is keyed on, so the save below and the restore above agree
          # on one spelling — a disagreement there stores nothing while reporting success.
          mkdir -p /tmp/nub/target/release
          cp /tmp/nubsrc/target/fast/nub /tmp/nub/target/release/nub

      # ⛔ WITHOUT THIS, REMOVING THE PREFIX FALLBACK WOULD COST A COLD BUILD ON *EVERY* RUN rather
      # than once per SHA. There was no save step here: the prefix let this probe live off binaries
      # other workflows happened to mint, which is what made the fallback load-bearing rather than
      # merely convenient. Saving is what makes the amortisation argument true.
      - name: Save the built binary under its exact SHA
        if: steps.nubbin.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NUB_BIN_CACHE_PATH }}
          key: nub-bin-v1-linux-${{ env.NUB_GIT_SHA }}

      - name: Point at the restored binary
        if: steps.nubbin.outputs.cache-matched-key != ''
        shell: bash
        run: |
          set -eu
          BIN=/tmp/nub/target/release/nub
          chmod +x "$BIN" 2>/dev/null || true
          "$BIN" --version
          echo "NUB_BIN=$BIN" >> "$GITHUB_ENV"

      # ⛔ THE GATE CHECKS ITSELF FIRST. A malformed catalog must be REJECTED before a well-formed
      # one is allowed to prove anything — otherwise a binary that never read the variable reads as
      # success, and every arm below silently measures the COMPILED-IN policy.
      - name: Assert the binary honours NUB_BUILD_JAIL_CATALOG
        shell: bash
        run: |
          set -uo pipefail
          printf '{"packages":{"x":{"default":{"read":"disk","write":"disk"}}}}' > /tmp/cat-bad.json
          printf '{"packages":{"__probe__":{"default":{"network":true}}}}'       > /tmp/cat-good.json
          BAD=$(NUB_BUILD_JAIL_CATALOG=/tmp/cat-bad.json "$NUB_BIN" --version 2>&1 || true)
          case "$BAD" in
            *REJECTED*) echo "control ok — a malformed catalog is refused" ;;
            *) echo "⛔ GATE IS INERT. Saw: ${BAD:-<none>}" >&2; exit 1 ;;
          esac
          GOOD=$(NUB_BUILD_JAIL_CATALOG=/tmp/cat-good.json "$NUB_BIN" --version 2>&1 || true)
          case "$GOOD" in
            *OVERRIDDEN*) echo "override engages: $GOOD" ;;
            *) echo "⛔ no OVERRIDDEN banner — binary lacks build-jail-catalog-override. Saw: ${GOOD:-<none>}" >&2; exit 1 ;;
          esac

      # ── INSTRUMENT 1: the synthetic known-answer fixture. Non-fatal on a REFUTED result — a
      # refutation is the finding, not a broken job — but FATAL when a negative control passes,
      # because then nothing downstream is readable either.
      - name: FIXTURE — four write targets under the empty grant
        shell: bash
        run: |
          set -uo pipefail
          chmod +x harness/v2/probes/tmp-write-fixture.sh
          harness/v2/probes/tmp-write-fixture.sh /tmp/tmpfix "$NUB_BIN" > /tmp/fixture.out 2>&1
          echo "FIXTURE_EXIT=$?"
          cat /tmp/fixture.out
          if grep -q 'A NEGATIVE CONTROL PASSED' /tmp/fixture.out; then
            echo "⛔ the jail did not enforce — no row in this run is readable" >&2; exit 1
          fi

      # ── INSTRUMENT 2: the real corpus packages, one arm per stated grant.
      #
      # ⛔ EACH LINE IS `pkg@version:grant`. `measure.sh` still runs OBSERVE (the artifact gate needs
      # its manifest as the reference for "did this arm produce what an unjailed install produces"),
      # then ONE jailed arm at exactly the stated grant — no synthesis, no ladder. Its three-outcome
      # vocabulary is preserved verbatim in the log: SUFFICIENT / INSUFFICIENT / VOID.
      - name: REAL — --at-grant arms
        shell: bash
        # ⛔ THE INPUT ARRIVES THROUGH `env:`, NEVER `${{ }}` INSIDE THE SCRIPT. Actions substitutes
        # the expression as raw TEXT before bash parses the line, so a grant like
        # `{"network":true}` closes the surrounding double-quoted string and bash re-parses the JSON
        # as shell words — the arm then ran at `{network:true}`, which `JSON.parse` rejects, and the
        # whole step died on the FIRST spec. MEASURED, run 31115255290.
        env:
          AT_GRANT_SPECS: ${{ inputs.at_grant_specs }}
        # ⛔ `-e` IS WRONG FOR THIS STEP AND MUST BE OVERRIDDEN. The default shell is `bash -e`, and
        # an INSUFFICIENT arm exits 1 — a legitimate, expected result. Under `-e` the first one
        # aborts the step, so the arms that would have explained it never run and the job reads as
        # broken rather than informative.
        run: |
          set +e
          set -uo pipefail
          SPECS="$AT_GRANT_SPECS"
          # ⛔ SPACE-separated, and a grant JSON therefore must carry no spaces. Stated rather than
          # assumed because a grant that DOES contain one splits into two specs and the second half
          # measures a package named `true}` — which fails in a way that reads like a jail result.
          # The default set answers the question the ladder cannot ask. Arms 1-3 are one package at
          # three grants that differ on ONE axis each: reproduce the recorded failure, widen READS
          # only, widen ONE write scope. Arm 4 is the cross-check — a package whose only `outside`
          # writes are also `/tmp` and which the corpus records as passing with no write scope at
          # all, so a failure there would indict the harness rather than the package.
          [ -z "$SPECS" ] && SPECS='playwright-chromium@0.17.0:{"network":true} playwright-chromium@0.17.0:{"read":"disk","network":true} playwright-chromium@0.17.0:{"write":{"deps":true},"network":true} hugo-extended@0.141.0:{"network":true}'
          chmod +x harness/v2/measure.sh
          mkdir -p /tmp/arms
          n=0
          for spec in $SPECS; do
            n=$((n+1))
            PV="${spec%%:*}"; GRANT="${spec#*:}"
            PKG="${PV%@*}"; VER="${PV##*@}"
            echo "═══════════════════════════════════════════════════════════════"
            echo "ARM $n  $PKG@$VER  at  $GRANT"
            harness/v2/measure.sh "$PKG" "$VER" "$NUB_BIN" --at-grant "$GRANT" > "/tmp/arms/arm-$n.out" 2>&1
            rc=$?
            echo "ARM_EXIT=$rc"
            cat "/tmp/arms/arm-$n.out"
            # 0 SUFFICIENT, 1 INSUFFICIENT, 3 VOID — `measure.sh`'s DIRECT-mode vocabulary, kept
            # distinct here because VOID is not a weaker INSUFFICIENT, it is "nothing was measured".
            case "$rc" in
              0) v=SUFFICIENT ;; 1) v=INSUFFICIENT ;; 3) v=VOID-NOTHING-MEASURED ;; *) v="rc=$rc" ;;
            esac
            printf '%-38s %-46s %s\n' "$PKG@$VER" "$GRANT" "$v" >> /tmp/arms/summary.txt
          done
          echo "═══════════════════════════════════════════════════════════════"
          echo "SUMMARY"
          cat /tmp/arms/summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-redirect-probe
          path: |
            /tmp/fixture.out
            /tmp/arms/
          if-no-files-found: warn
