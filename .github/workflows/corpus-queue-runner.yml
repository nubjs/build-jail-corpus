# Pop a slice off the queue, measure it, commit the results AND the queue update together.
#
# THE SHAPE: one job = one OS = one slice. It claims N pending rows for its OS, runs them, then
# commits `records/` and `queue.ndjson` in ONE commit. That single commit is what makes a claim
# durable: a run that dies mid-slice leaves its rows `claimed` with its run id — attributable and
# reclaimable — rather than silently lost or double-run.
#
# ⛔ WHY SLICES AND NOT ONE BIG FAN-OUT. A 6,750-row corpus dispatched as one matrix is
# unobservable, unresumable, and loses everything an expiring artifact held. Slices are small enough
# that a failure costs ~100 runs, the queue file shows coverage at a glance, and the records land in
# git as they are produced.
#
# ⛔ RUNNERS ARE FULLY PARALLEL, ACROSS AND WITHIN AN OS. What makes that safe is that a claim is
# PUSHED before any measuring starts, so two runners can never hold the same row: a loser re-claims
# against the queue that already carries the winner's claim and takes different rows. Records are
# add-only and unique per (platform, package, version), so the only shared file is the queue, and
# every writer re-derives it from origin rather than merging its own copy in.

name: corpus-queue-runner

on:
  workflow_dispatch:
    inputs:
      os:
        description: which operating system to measure
        type: choice
        options: [linux, macos, windows]
        required: true
      slice:
        description: how many queue rows to claim
        type: string
        default: "100"
      nub_sha:
        description: nubjs/nub commit to build the probe binary from
        type: string
        required: true
      chain:
        description: re-dispatch itself while the queue still has pending rows
        type: boolean
        default: true
      force:
        # ⛔ RE-MEASURE ROWS THAT ALREADY HAVE A RECORD. search.mjs is RESUMABLE BY DEFAULT and
        # skips a spec whose prior record is a measurement, so REOPENING A QUEUE ROW IS NOT ENOUGH
        # on its own — the runner would find the stale record, skip, and mark the row done again,
        # a re-measure that silently measures nothing. Set this when reopening rows after a jail or
        # harness fix. Costs nothing on rows that have no record yet.
        description: "re-measure even when a record already exists (use after reopening rows)"
        type: boolean
        default: false
      busybox_shell:
        # ⛔⛔ THE WIN32 CORPUS MEASURES A SHELL NUB DOES NOT SHIP. `release.yml:746-753` bundles
        # `vendor/busybox-w32/busybox64.exe` beside `nub.exe`, and `resolve_bundled_busybox()` makes
        # it the lifecycle shell for EVERY script nub runs on Windows. This workflow builds with a
        # bare `cargo build`, whose output dir has no busybox.exe beside it — so every Windows record
        # in this corpus was measured through the `cmd.exe` FALLBACK instead.
        #
        # It stayed invisible because the fallback is silent and both shells "work". It surfaced only
        # when busybox was staged on a real Windows box and the jail then refused EVERY dependency
        # lifecycle script ("a verbatim command line is only accepted for the Windows command
        # interpreter, not ...\busybox.exe") — nub `1b4a5488c1` fixes that, so staging is now safe.
        #
        # ⛔ OPT-IN, DEFAULT OFF, AND DELIBERATELY SO: turning it on for the whole fleet would change
        # the measurement basis MID-CORPUS, mixing two shells in one dataset. Run it as an A/B ARM on
        # a handful of specs against an otherwise identical binary, exactly like the appdata arm.
        #
        # READ THE RESULT AS: grants IDENTICAL under both shells => the existing win32 corpus is valid
        # despite measuring the wrong shell, and this becomes a cheap standing check. Grants DIFFER =>
        # the win32 corpus measures a configuration users never get, and the scope of the re-measure
        # is decided by how many specs differ. ⛔ Neither reading is available without running it.
        #
        # Uses `__NUB_BUSYBOX_EXE` — cli.rs documents it as exactly this seam ("lets the Rust suite
        # and the branch-scoped Windows probe supply a busybox without the release-packaging step").
        # That survives the binary cache, where copying a file beside the exe would not: the cache
        # restores ONLY nub.exe, so a cache hit would silently drop a copied sidecar and measure the
        # fallback again while reporting the arm as engaged.
        description: "ARM: use the BUNDLED busybox lifecycle shell (what release.yml ships) instead of the cmd.exe fallback — windows only"
        type: boolean
        default: false
      fail_closed_read_grants:
        # ⛔ DIAGNOSTIC ONLY, and it can only make the jail STRICTER — never a widening lever.
        #
        # Sets NUB_SANDBOX_WIN_FAIL_CLOSED_READ_GRANTS for the measured nub. The Windows backend
        # normally SKIPS a read-grant ACE it cannot install; this restores the old fail-closed
        # behaviour, so an uninstallable read grant ABORTS the launch with the path in the error.
        #
        # THE QUESTION IT ANSWERS, and windows.rs asks for exactly this arm: two witnesses fail with
        # `spawnSync C:\Windows\system32\cmd.exe EPERM` (bs-platform@9.0.2, 51 of 54 logs) and
        # `Command failed: C:\Windows\system32\cmd.exe /s /c "touch ..."` (jpegtran-bin@5.0.2),
        # while optipng-bin@8.1.0 succeeds at the `network` rung with ZERO fs grants. windows.rs
        # names the fail-closed path as "the prime suspect for a sibling lane's finding that
        # `cmd.exe` cannot run confined at all de-elevated" and says plainly: "Without an arm that
        # restores the old behaviour on the same fixture, neither reading can be told from the other."
        #
        # READ THE RESULT AS: launch ABORTS naming a System32 path => the ACE genuinely cannot be
        # installed de-elevated, cause CONFIRMED. Launch proceeds and still EPERMs at the spawn =>
        # the ACE installs fine and the refusal is elsewhere.
        description: "DIAGNOSTIC: fail closed on uninstallable read-grant ACEs (names the path)"
        type: boolean
        default: false
      pkg_budget_seconds:
        # ⛔ THE #133 BUCKET IS AN ABSENCE, NOT A MEASUREMENT: 112 records carry a HARNESS-* verdict
        # (67 TIMEOUT / 39 ERROR / 6 CRASH), and they cluster on exactly what users install --
        # @aws-amplify/cli, hugo-extended, postman-code-generators, purescript, appium. The catalog
        # silently omits those entries; nothing downstream says a package was never answered.
        #
        # run-batch.sh reads NUB_CORPUS_PKG_BUDGET (default 2400s) and the workflow never set it, so
        # the knob that f79a65b9 added was unreachable from CI. This exposes it.
        #
        # ⛔ RAISING IT CHANGES NO MEASUREMENT SEMANTICS. The budget is a wall-clock cap on the whole
        # per-package walk; the cell that passes is unchanged, the walk just gets to finish. So a
        # slow-lane record stays comparable with every other record.
        # ⛔ DO NOT RAISE IT FOR A FULL QUEUE SLICE. The 350-minute job cap only fits a 20-row windows
        # slice because most packages finish well inside 2400s; a raised budget on a full slice risks
        # the job cap and loses the WHOLE slice. Use it with `packages`, on a handful at a time.
        description: "per-package wall-clock budget in seconds (default 2400; raise only with `packages`)"
        type: string
        default: ""
      packages:
        # ⛔ DEBUG ESCAPE HATCH. Space-separated pkg@version specs. When set, the runner SKIPS the
        # QUEUE — no claim, no completion, no end-of-slice commit, and none of the verify/parse gates
        # — and measures exactly these with --force.
        #
        # ⛔⛔ IT DOES **NOT** LEAVE THE CORPUS UNTOUCHED. This comment previously claimed the run
        # published "only the ARTIFACT" and wrote "nothing into the corpus". That was FALSE, and it is
        # the kind of false guarantee you plan around: `NUB_CORPUS_ON_RECORD` is set unconditionally
        # below, and `run-batch.sh` fires it after EVERY record regardless of whether the spec came
        # from a queue claim or from this list. So each measured record is committed and pushed to
        # main, one commit per record, exactly as a queue-driven slice would.
        #
        # MEASURED: a debug run over three lefthook packages produced commits d2155fdd and c3e42870
        # ("corpus: @arkweid/lefthook@0.7.7 MINIMUM"), with record timestamps identical to the run's.
        #
        # ⛔ THE PUBLISHING IS USUALLY WHAT YOU WANT — a measurement on a real nub commit is a real
        # measurement, and `provenance.nubGitSha` records which binary produced it — so this is
        # documented rather than disabled. THE HAZARD TO KEEP IN MIND: combined with --force, a debug
        # run built from an OLDER commit will overwrite a record that a NEWER binary produced. When
        # probing a non-tip commit for comparison, expect to re-measure afterwards.
        description: "debug only: measure these specs instead of claiming from the queue"
        type: string
        default: ""


concurrency:
  # ⛔ SAME-OS RUNNERS NOW RUN IN PARALLEL. They used to be serialised because a claim lived only in
  # the claiming runner's working tree until the end of its slice, so a second runner read the same
  # pending rows and measured the same packages — measured on a local rig: three concurrent runners
  # claiming 4 rows each from a 10-row queue took the IDENTICAL 4, i.e. 4 distinct of 12. Parallelism
  # bought nothing at all. With the claim published before measuring, the same rig gives 10 distinct
  # of 10.
  #
  # This is the only lever that moves Windows: 2,250 rows at the measured 13.2 min/package is ~23 days
  # serialised, and divides directly by the number of concurrent runners.
  #
  # The group is keyed on the RUN so nothing is ever cancelled — an interrupted job would strand its
  # claim until --reclaim-stale ages it out six hours later.
  group: corpus-queue-${{ inputs.os }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  slice:
    runs-on: >-
      ${{ inputs.os == 'linux' && 'ubuntu-latest'
       || inputs.os == 'macos' && 'macos-latest'
       || 'windows-latest' }}
    timeout-minutes: 350
    permissions:
      contents: write        # commits results + queue back
      actions: write         # re-dispatches itself when chaining
    env:
      # ⛔⛔ JOB-SCOPED ON PURPOSE — TWO STEPS MUST RESOLVE THE SAME PATH.
      # `harness/publish-record.sh` WRITES this manifest during the measure step; the end-of-slice
      # commit READS it to decide which records are genuinely this run's (see the stash block, which
      # otherwise reverts other runners' work — that is what commit f749ade8 did to a win32 record).
      #
      # It used to be set only on the MEASURE step. A step-level `env:` does not reach other steps,
      # so the commit step fell through to the shared default `${TMPDIR:-/tmp}/…` — and on a macOS
      # runner TMPDIR is `/var/folders/…/T/`, NOT `/tmp`. Writer and reader would have resolved
      # DIFFERENT paths, the manifest would have read as missing, and the fix would have degraded
      # silently to the whole-tree stash it exists to replace — on macOS, the very platform whose
      # slice commit caused the reversion.
      NUB_CORPUS_MANIFEST: /tmp/nub-corpus-published.txt
      NUB_SANDBOX_WIN_FAIL_CLOSED_READ_GRANTS: ${{ inputs.fail_closed_read_grants && '1' || '' }}
      NUB_CORPUS_PKG_BUDGET: ${{ inputs.pkg_budget_seconds }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # The probe binary comes from nubjs/nub at an explicit SHA, never from a floating branch: every
      # record's provenance names the nub it measured, and an old corpus must stay reproducible.
      # ⛔ STAMP THE JOB'S START BEFORE THE BUILD — the measure deadline is relative to THE JOB, and
      # the build is the largest and most variable slice of it (~20 min warm, ~90 min cold on
      # Windows). This step sat AFTER the build at first, which made the deadline measure-relative
      # again and the guard inert: it would have granted the full remaining budget on top of whatever
      # the build had already spent, overrunning the very cap it exists to respect.
      - name: Stamp the job start
        shell: bash
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      # ⛔ WINDOWS SPENDS ALMOST ALL ITS TIME IN DEFENDER, NOT IN MEASUREMENT.
      #
      # MEASURED from one completed Windows slice's artifact: 6,187,953 file operations across 669
      # cells, a mean of 9,250 files per cell — and every cell does that work TWICE, once to walk the
      # tree for `digestOf(seen)` and once to delete it. The heaviest packages are far worse:
      # pngquant-bin@9.0.0 walked 568,932 files across its 55 cells, so a single package costs over a
      # million file operations.
      #
      # The install itself is not the cost. The same artifact shows `nub 0.6.0 · ✓ installed 1 package
      # in 947ms` — sub-second. Roughly 99% of the ~9 min/package on Windows is filesystem overhead,
      # and Defender real-time protection scans every one of those operations. This is the standard
      # cause of exactly this profile on Windows CI, and nothing here had ever excluded anything.
      #
      # ⛔ THIS IS A DELIBERATE POSTURE CHANGE, SCOPED AS NARROWLY AS IT CAN BE. The excluded paths are
      # the throwaway fixture root and nub's cache — not the drive, not the workspace. It is worth
      # naming what it does and does not cost:
      #   - these lifecycle scripts are ALREADY EXECUTING by design; Defender scanning the files they
      #     write afterwards is not what contains them. The build jail is, and it stays on.
      #   - an OSV malicious-package screen runs in `search.mjs` (`screenForMalicious`) over the WHOLE
      #     RESOLVED TREE, unconditionally, immediately before any lifecycle script is executed, and
      #     it FAILS CLOSED — a curl failure, a parse failure, or a result count that does not match
      #     the query count all THROW rather than proceed. Proven able to fire: 8 corpus rows carry
      #     `REFUSED-MALICIOUS` / `MALICIOUS-PACKAGE-DETECTED` (apollo-server@0.1.5, webdev-toolkit,
      #     @azure-devops/mcp).
      #     ⛔ BE PRECISE ABOUT WHAT THAT BUYS, because this line previously overclaimed it. The
      #     screen runs on the RESOLVED tree, so a known-malicious tarball IS fetched to this
      #     machine; what never happens is its lifecycle scripts RUNNING. "Known-bad code never
      #     reaches this machine" was false. (`harness/prescreen-queue.mjs` exists and screens the
      #     queue up front, but it is NOT invoked by this workflow, so it is not part of this trade.)
      #   - the runner is ephemeral and holds no secret beyond GITHUB_TOKEN, scoped to this repo.
      # If that trade is ever judged wrong, deleting this step restores the previous behaviour exactly.
      - name: Stand Defender down for the fixture tree (Windows only)
        if: inputs.os == 'windows'
        shell: pwsh
        continue-on-error: true    # a runner image without Defender must not fail the slice
        run: |
          $paths = @("$env:USERPROFILE\.cache", "$env:LOCALAPPDATA\nub", "$env:TEMP")
          foreach ($p in $paths) {
            try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop; Write-Host "excluded $p" }
            catch { Write-Host "could not exclude $p : $_" }
          }
          try {
            $prefs = Get-MpPreference
            Write-Host "exclusions now: $($prefs.ExclusionPath -join ', ')"
          } catch { Write-Host "Get-MpPreference unavailable" }

      # ⛔ CLONE BEFORE THE CACHE RESTORE. `git clone` refuses a non-empty destination, and
      # rust-cache restores `target/` INTO the workspace path — so with the clone second, the very
      # first cache HIT would fail the build. That ordering survived only because the cache never
      # hit (see the key defect below), which is the worst kind of latent bug: harmless until the
      # thing it depends on starts working.
      #
      # No credential is involved. nubjs/nub is PUBLIC, so this is an anonymous HTTPS clone and the
      # GITHUB_TOKEN's same-repo scope never applies. ⛔ IF NUB EVER GOES PRIVATE THIS BREAKS and
      # needs a PAT or deploy key.
      #
      # `--filter=blob:none` rather than `--depth 1`: the sha we want lives on a feature branch, not
      # on the default branch, so a depth-1 clone of main then had to fetch the sha separately and
      # download main's tree for nothing. A blobless partial clone fetches commits/trees now and
      # blobs on demand, so checking out any sha works without a second fetch.
      - name: Clone nub at the requested commit
        shell: bash
        run: |
          set -eux
          git clone --filter=blob:none --no-checkout https://github.com/nubjs/nub.git /tmp/nub
          cd /tmp/nub
          git checkout --detach "${{ inputs.nub_sha }}"
          git log --oneline -1

          # ⛔ NORMALIZE THE COMMIT BEFORE ANYTHING KEYS ON IT.
          #
          # `inputs.nub_sha` is free text and git accepts every spelling of a commit — full sha,
          # abbreviated sha, branch, tag. The binary cache key is built by STRING INTERPOLATION of
          # that input and matches EXACTLY (no restore-keys), so two dispatches of the SAME commit
          # spelled differently key differently: one restores, the other silently cold-builds and
          # then saves a duplicate entry that the first spelling will never hit again.
          #
          # MEASURED: dispatching four Windows chains with a 10-char sha, while a full-40-char entry
          # for the identical commit sat in the cache, missed all four and cold-built all four
          # (~26 min each). The tell was `Build the probe binary` RUNNING at all — it is guarded by
          # `cache-hit != 'true'`, so its mere presence in the step list proves the restore missed.
          #
          # Resolving to the canonical full sha here makes every spelling converge on one key, and
          # it also makes `provenance.nubGitSha` in the records independent of how a run was
          # dispatched — previously a record's sha length told you the operator's typing habits.
          echo "NUB_FULL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          # ⛔ SAY OUT LOUD WHEN THIS CHAIN IS MEASURING A STALE BINARY.
          #
          # The chain self-dispatch forwards `nub_sha` VERBATIM, so a chain launched hours ago
          # re-dispatches itself on that same commit indefinitely and NEVER picks up a fix. Pinning
          # is deliberate — it keeps a chain's records comparable, and re-resolving each hop would
          # pay a cold rebuild (~26 min on Windows) every time the branch moved — but nothing
          # surfaced the staleness, so it was only discoverable by counting `provenance.nubGitSha`
          # across committed records well after the fact.
          #
          # MEASURED, and this warning exists because of it: over one 3-hour window, windows was
          # 81/81 records (100%) on a commit predating every then-current fix, linux 504/548 (92%),
          # macos 123/224 (55%). Both Windows-targeted fixes were invisible to the production fleet
          # and that platform's disk-grant rate sat frozen while looking merely slow.
          #
          # ⛔ A WARNING, NOT A FAILURE. A stale chain still produces VALID records — it measures an
          # older binary, which OVER-grants relative to a fixed one, and over-granting is the safe
          # direction. Failing here would throw away good work and strand claimed rows. The cost is
          # runner time and a frozen metric, so the right response is to notice and roll forward,
          # which is a judgement call about timing that belongs to the operator, not to this step.
          # Every command here is `|| true`-guarded: this block is DIAGNOSTIC, and `set -e` is on, so
          # an unguarded network blip in `ls-remote` would abort a measuring run over a status line.
          TIP=$(git ls-remote https://github.com/nubjs/nub.git sandbox/integration 2>/dev/null | cut -f1 || true)
          CUR=$(git rev-parse HEAD || true)
          if [ -n "$TIP" ] && [ -n "$CUR" ] && [ "$TIP" != "$CUR" ]; then
            echo "::warning::measuring nub ${CUR:0:10}, which is NOT the sandbox/integration tip ${TIP:0:10}. A chain never advances its own nub_sha — dispatch a fresh chain at the tip to measure recent fixes."
          elif [ -n "$TIP" ]; then
            echo "nub_sha is at the sandbox/integration tip"
          else
            echo "could not reach the nub remote to check tip freshness — skipping the staleness check"
          fi

      # ⛔ THE BINARY-CACHE PATH MUST BE NATIVE, AND ON WINDOWS `/tmp/...` IS NOT.
      #
      # `actions/cache` runs in NODE. Every bash step here sees `/tmp/nub/target/release/nub.exe`
      # correctly because Git-bash maps `/tmp`, but Node on Windows resolves that same string against
      # the Windows filesystem, where it does not exist. The save therefore found nothing — and said
      # so as a WARNING, so the step still reported SUCCESS:
      #
      #     path: /tmp/nub/target/release/nub.exe
      #     [warning]Path Validation Error: Path(s) specified in the action for caching do(es) not
      #              exist, hence no cache is being saved.
      #     ##[warning]Cache save failed.
      #
      # MEASURED CONSEQUENCE: `gh cache list` carried nub-bin entries for linux and macos and NONE for
      # windows, so every Windows slice paid a full cold Rust build (~20-25 min) — on the one platform
      # that bounds the whole corpus ETA. A green step that silently does nothing is exactly the class
      # this workflow keeps getting caught by, and it is why the check below prints the resolved path.
      #
      # Resolved HERE rather than in the build step because `cache/restore` runs BEFORE the build and
      # must name the same path. The file need not exist yet — restore only needs the string.
      - name: Resolve the native path of the built binary
        shell: bash
        run: |
          set -eu
          P=/tmp/nub/target/release/nub
          [ "${{ inputs.os }}" = "windows" ] && P="$P.exe"
          # cygpath ships with Git-bash on the Windows runners; elsewhere the POSIX path IS native.
          if command -v cygpath >/dev/null 2>&1; then P="$(cygpath -w "$P")"; fi
          echo "NUB_BIN_CACHE_PATH=$P" >> "$GITHUB_ENV"
          echo "binary cache path (native): $P"

      # ⛔ THE KEY MUST NOT INCLUDE THE NUB SHA. It did, and that made every new nub commit a
      # guaranteed MISS — which is precisely backwards for a build cache. My original reasoning was
      # "a cache hit is only correct for the exact source", and that conflates the CACHE with the
      # ARTIFACT: restoring a warm target dir cannot produce a wrong binary, because cargo decides
      # what to rebuild from content. rust-cache's own key already folds in Cargo.lock and the rustc
      # version, which is the correctness boundary that actually matters.
      #
      # MEASURED with the sha in the key: macOS restored in 0.0 min (nothing there) and then built
      # for 13.5 min; the first Windows run built for 27.6 min. Every run paid full freight.
      #
      # `cache-on-failure` is load-bearing here too. It defaults to FALSE, and this workflow's runs
      # were failing at the COMMIT step — after a perfectly good build — so the cache was discarded
      # every time. A slice that measured 100 packages and lost the push should not also throw away
      # its compilation.
      # ⛔ CACHE THE BUILT BINARY, KEYED ON THE NUB COMMIT — and note this is the exact INVERSE of
      # the rule for the compile cache below. A commit sha is the WRONG key for a compile cache,
      # because cargo already decides what to rebuild from content and keying on the sha guarantees a
      # miss on every new commit. It is the RIGHT key for an ARTIFACT cache, because a binary really
      # is a pure function of (commit, platform, features) — the same inputs can only produce the
      # same nub.
      #
      # MEASURED, and this is why it is worth a second cache: rust-cache alone took a Linux build
      # from 12.4 min cold to 11.2 min warm — about 10%. That is rust-cache working as designed, not
      # a defect: it caches DEPENDENCY artifacts and deliberately prunes workspace crates, and nub's
      # own workspace is the bulk of the compile. Restoring the finished binary skips all of it.
      #
      # Over the ~60 slices still needed to drain the corpus that is roughly 12 hours of runner time
      # that produces nothing.
      # ⛔ RESTORE AND SAVE ARE SEPARATE STEPS, AND THAT IS NOT A STYLE CHOICE. With a single
      # `actions/cache`, the save runs as a POST step — and post steps run in REVERSE registration
      # order, so `Post Cache the probe build` (rust-cache) runs BEFORE this one. rust-cache's post
      # step PRUNES WORKSPACE CRATE ARTIFACTS, which deletes `target/release/nub`, so by the time the
      # binary cache tried to save there was nothing there:
      #
      #     Path Validation Error: Path(s) specified in the action for caching do(es) not exist,
      #     hence no cache is saved.
      #
      # The cache could therefore never populate, and every run rebuilt while looking like it had a
      # cache configured. MEASURED on two consecutive probes: the second restored in 0.0 min and
      # rebuilt from scratch. Saving explicitly in the MAIN phase, immediately after the build, puts
      # it beyond the reach of any post-step cleanup.
      - name: Restore a previously built nub for this exact commit
        id: nubbin
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NUB_BIN_CACHE_PATH }}
          # `v1` is a manual epoch: bump it if the build FLAGS change, since the flags are not in the
          # key and a stale binary built with different features would be silently wrong.
          key: nub-bin-v1-${{ inputs.os }}-${{ env.NUB_FULL_SHA }}

      - name: Cache the probe build
        # Skipped on a binary hit: there is nothing left to compile, so restoring a dependency cache
        # and saving it again at job end is pure cost. It also removes any chance of rust-cache's
        # archive extracting over the binary restored above — same target/ dir, and ordering that
        # depends on what another action happens to put in its tarball is not a thing to rely on.
        if: steps.nubbin.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: /tmp/nub
          shared-key: corpus-probe-${{ inputs.os }}
          cache-on-failure: true

      - name: Build the probe binary
        # Skipped entirely when the binary for this exact commit was restored above.
        if: steps.nubbin.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -eux
          cd /tmp/nub
          cargo build --release -p nub-cli --features nub-cli/build-jail-catalog-override
          echo "NUB_BIN=/tmp/nub/target/release/nub${{ inputs.os == 'windows' && '.exe' || '' }}" >> "$GITHUB_ENV"

      # Save NOW, in the main phase, while the binary still exists — see the restore step above for
      # why a post-phase save silently never happened.
      - name: Save the built nub for the next slice
        if: steps.nubbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NUB_BIN_CACHE_PATH }}
          key: nub-bin-v1-${{ inputs.os }}-${{ env.NUB_FULL_SHA }}

      # ⛔ SET NUB_BIN ON THE CACHE-HIT PATH TOO. The build step above is skipped on a hit, and it is
      # the step that exports NUB_BIN — so without this the whole slice would run with an empty
      # binary path. A cache hit making the job fail would be a memorable way to learn this.
      - name: Point at the restored binary
        if: steps.nubbin.outputs.cache-hit == 'true'
        shell: bash
        run: |
          BIN=/tmp/nub/target/release/nub${{ inputs.os == 'windows' && '.exe' || '' }}
          chmod +x "$BIN" 2>/dev/null || true
          # Prove it RUNS before trusting it. A restored file of the right size that cannot execute
          # would otherwise surface as a confusing failure much later, inside the first measurement.
          "$BIN" --version
          echo "NUB_BIN=$BIN" >> "$GITHUB_ENV"

      # ⛔ THE ARM THAT MAKES WINDOWS MEASURE THE SHELL IT ACTUALLY SHIPS. See the `busybox_shell`
      # input for why this is opt-in and what each outcome means. Placed AFTER both binary paths
      # (build and cache-hit) so it engages either way.
      - name: Use the bundled busybox lifecycle shell (ARM)
        if: inputs.busybox_shell && inputs.os == 'windows'
        shell: bash
        run: |
          set -eu
          SRC=/tmp/nub/vendor/busybox-w32/busybox64.exe
          # ⛔ VERIFY THE ARM ENGAGED RATHER THAN ASSUMING IT. A silently-absent sidecar would make
          # this arm measure the cmd.exe fallback while REPORTING that it measured busybox — the
          # single most expensive failure shape this corpus keeps hitting.
          test -f "$SRC" || { echo "⛔ busybox sidecar missing at $SRC — the arm cannot engage"; exit 1; }
          # Pin it to the exact binary release.yml ships, so the arm cannot drift from production.
          WANT=07bb1e5b095b00d68a695481f9240879f33c5724b40aa2308f999d54ed78f075
          GOT=$(sha256sum "$SRC" | cut -d' ' -f1)
          test "$GOT" = "$WANT" || { echo "⛔ busybox sha mismatch: $GOT != $WANT (release.yml pins this)"; exit 1; }
          # nub reads a WINDOWS path; this step runs in Git Bash, so translate rather than passing
          # the /tmp spelling — Node and nub both resolve `/tmp/...` against a drive that has no such
          # directory, which is exactly how an earlier cache save silently stored nothing.
          WINPATH=$(cygpath -w "$SRC")
          echo "__NUB_BUSYBOX_EXE=$WINPATH" >> "$GITHUB_ENV"

      # ⛔ THE SAME ASSERTION FOR THE OTHER ARM, WHICH HAD NONE. `fail_closed_read_grants` only sets
      # a job-level env var, so an arm that failed to propagate would produce results IDENTICAL to
      # an arm that was never requested — and "unchanged" is exactly the reading the experiment is
      # trying to distinguish. That is the #110 ambiguity (a jail-off control that could not be shown
      # to have run unjailed) in a new place, and #82's rule applies: a step whose value is a SIDE
      # EFFECT must assert the side effect, and FAIL rather than warn.
      #
      # The plumbing IS sound as of 2026-08-04 — verified by reading it end to end: the job `env:`
      # sets the variable, and `harness/search.mjs:344` spawns the measured nub with
      # `env: { ...process.env, … }`, spreading the ambient environment rather than curating a fresh
      # one. This step exists so a future change to EITHER end fails loudly here instead of silently
      # producing an inert arm whose null result reads as a finding.
      - name: Assert the fail-closed arm engaged (ARM)
        if: inputs.fail_closed_read_grants && inputs.os == 'windows'
        shell: bash
        run: |
          set -eu
          test "${NUB_SANDBOX_WIN_FAIL_CLOSED_READ_GRANTS:-}" = "1" || {
            echo "⛔ fail_closed_read_grants was requested but NUB_SANDBOX_WIN_FAIL_CLOSED_READ_GRANTS is '${NUB_SANDBOX_WIN_FAIL_CLOSED_READ_GRANTS:-<unset>}' — the arm would be INERT and its results indistinguishable from a normal run"
            exit 1
          }
          echo "ARM ENGAGED: NUB_SANDBOX_WIN_FAIL_CLOSED_READ_GRANTS=1 (read-grant ACEs now fail closed)"
          echo "ARM ENGAGED: lifecycle shell = $WINPATH (sha $GOT)"

      # ⛔ THE ONLY WAY TO GET A CI-BUILT nub.exe ONTO A DEV BOX, AND IT UNBLOCKS ALL WINDOWS
      # REPRODUCTION. Two stock Windows Server 2022 VMs cannot run a JAILED `node` at all -- every
      # invocation dies 0xC0000142 STATUS_DLL_INIT_FAILED while `cmd.exe` runs fine -- yet the corpus
      # records the same package (@bazel/jasmine@4.6.2) as grant:null PASSING here. Until a CI-built
      # binary is tested in that environment, "the VM's locally-built nub.exe differs from CI's"
      # cannot be separated from "a stock Windows box genuinely breaks the jail", and the second
      # would be severe: the jail is ON BY DEFAULT and that package needs ZERO grants.
      #
      # The nub-bin CACHE cannot serve this — GitHub's cache API is not reachable from outside a run.
      # Windows only, so no other leg pays for it; additive, so no measurement semantics change.
      #
      # ⛔ USES `NUB_BIN_CACHE_PATH`, NOT `/tmp/nub/...`, FOR THE REASON DOCUMENTED ABOVE: this action
      # runs in NODE, and Node on Windows resolves `/tmp/...` against the Windows filesystem where it
      # does not exist. That is exactly how the cache save silently stored nothing while reporting
      # success. `if-no-files-found: error` rather than `warn` so a future path regression FAILS here
      # instead of producing an empty artifact that reads as a working escape hatch.
      - name: Publish the Windows probe binary for off-CI reproduction
        if: inputs.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: nub-exe-${{ github.run_id }}
          path: ${{ env.NUB_BIN_CACHE_PATH }}
          retention-days: 5
          if-no-files-found: error

      - name: Reclaim rows stranded by a dead run
        if: inputs.packages == ''
        shell: bash
        run: node harness/claim-slice.mjs --reclaim-stale 360

      - name: Claim a slice
        if: inputs.packages == ''
        shell: bash
        run: |
          # ⛔ WINDOWS MEASURES ~13x SLOWER PER PACKAGE, SO IT CANNOT TAKE THE SAME SLICE.
          #
          # MEASURED on the one Windows run that completed (nubjs/nub 30790327108, shard 20/150):
          # 15 packages in a 198-minute probe step = 13.2 min/package. A 100-package slice therefore
          # needs ~1,320 minutes of measuring against this job's 350-minute cap — so every Windows
          # slice would hit the cap having measured ~20, commit NOTHING, leave 100 rows claimed, and
          # kill the chain. Windows could never finish a slice at all.
          #
          # Claiming fewer rows is the primary fix, because a row claimed and then abandoned is worse
          # than one never claimed: it is unavailable until --reclaim-stale ages it out 6 hours later.
          # The deadline guard in the measure step is the safety net for when this estimate is wrong.
          SLICE="${{ inputs.slice }}"
          if [ "${{ inputs.os }}" = "windows" ] && [ "$SLICE" -gt 20 ]; then
            echo "windows: clamping slice $SLICE -> 20 (13.2 min/package measured; 350-min job cap)"
            SLICE=20
          fi
          # ⛔ PUBLISH THE CLAIM BEFORE MEASURING ANYTHING. The claim used to live only in this
          # runner's working tree until the end-of-slice commit, so a second runner on the same OS
          # read the same pending rows and measured the same packages. That is the reason same-OS
          # runs have to be serialised, and serialisation is what puts Windows at roughly 23 days for
          # its 2,250 rows at the measured 13.2 min/package.
          #
          # Pushing the claim first makes it exclusive, which is what lets runners be parallel. Each
          # retry RE-CLAIMS against the queue it just fetched rather than re-pushing the same rows:
          # --claim only ever takes `pending` rows, so a loser automatically picks up rows the winner
          # did not take and the two converge on disjoint slices with no coordination.
          #
          # Taking origin's queue.ndjson VERBATIM each round is what keeps that safe. Carrying a
          # locally-modified copy across the retry would replay my claim over a queue that has since
          # gained other runners' claims, and writing that back would silently release their rows.
          git config user.name corpus-runner
          git config user.email corpus-runner@users.noreply.github.com
          CLAIMED=0
          for attempt in 1 2 3 4 5 6; do
            # ⛔ A MIXED RESET (the default), NOT --soft. --soft leaves the INDEX as it was at
            # checkout, so the commit carries that whole stale tree — including a copy of
            # .github/workflows/ from before any workflow edit that landed while this job was
            # building. GITHUB_TOKEN may not modify workflow files, so every push is rejected:
            #
            #     ! [remote rejected] HEAD -> main (refusing to allow a GitHub App to create or
            #       update workflow .github/workflows/corpus-queue-runner.yml without `workflows`
            #       permission)
            #
            # All six attempts then fail identically and the job refuses to measure. MEASURED: run
            # 30846653540 burned a full 12-minute build and died here. A mixed reset points HEAD at
            # origin AND clears the index, leaving the working tree alone, so only the queue this
            # step explicitly stages reaches the commit.
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q "origin/$GITHUB_REF_NAME"
            git checkout -q "origin/$GITHUB_REF_NAME" -- queue.ndjson
            node harness/claim-slice.mjs \
              --claim "$SLICE" --os "${{ inputs.os }}" --run "${{ github.run_id }}" \
              > /tmp/slice.txt
            # An empty slice means this OS is finished. Nothing to publish, so do not push.
            if [ ! -s /tmp/slice.txt ]; then
              echo "DRAINED=1" >> "$GITHUB_ENV"
              CLAIMED=1
              break
            fi
            N=$(wc -l < /tmp/slice.txt | tr -d ' ')
            git add queue.ndjson
            git commit -q -m "corpus(${{ inputs.os }}): claim $N rows [run ${{ github.run_id }}]"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              CLAIMED=1
              echo "claimed $N rows"
              break
            fi
            echo "claim push $attempt rejected — re-claiming against the new head" >&2
            sleep $((attempt * 4))
          done
          # ⛔ FAIL rather than measure on an unpublished claim. Carrying on would duplicate whatever
          # another runner is already measuring: a whole job spent producing records that already
          # exist, and no progress on the queue.
          if [ "$CLAIMED" != "1" ]; then
            echo "could not publish a claim after 6 attempts — refusing to measure" >&2
            exit 1
          fi

      # ⛔ DEBUG PATH. Writes the worklist straight from the input, so nothing touches the queue.
      - name: Take the debug package list instead of a claim
        if: inputs.packages != ''
        shell: bash
        env:
          PKGS: ${{ inputs.packages }}   # via env, never raw ${{ }} in the script body — safer, and it does not depend on dispatch-time expansion
        run: |
          # ⛔ SPLIT ON COMMAS AND NEWLINES TOO, NOT JUST SPACES. A comma list is what a human
          # actually types, and space-only splitting turns one into a SINGLE spec that measures a
          # package which does not exist. MEASURED, run 30953140798: a 5-package comma list parsed as
          #   pkg="@ffprobe-installer/linux-arm64@5.2.0,…,@ffmpeg-installer/linux-x64" version="4.1.0"
          # — the LAST `@` decided the split — producing a well-formed HARNESS-ERROR record while the
          # run reported SUCCESS. Nothing said the re-measure had not happened. That is worse than a
          # crash here, because targeted `packages` re-measurement is the ONLY way to replace an
          # already-recorded spec (the queue skips anything holding a record), so the silent no-op
          # blocks the whole fix -> re-measure loop while looking like a completed run.
          printf '%s' "$PKGS" | tr ' ,\n' '\n\n\n' | grep . > /tmp/slice.txt || true
          echo "DEBUG_MODE=1" >> "$GITHUB_ENV"
          echo "measuring these, bypassing the queue:"
          cat /tmp/slice.txt
          test -s /tmp/slice.txt || { echo "⛔ empty package list — the input did not arrive"; exit 1; }
          # ⛔ EVERY SPEC MUST LOOK LIKE name@version, or it is not a spec. The parse above cannot
          # tell a malformed entry from a real one, and the harness will dutifully "measure" it —
          # which is exactly how the failure above stayed invisible. Fail the run instead.
          while read -r spec; do
            case "$spec" in
              *,*) echo "⛔ '$spec' still contains a comma — the separator split did not work"; exit 1 ;;
            esac
            printf '%s' "$spec" | grep -qE '^@?[^@]+@[^@]+$' \
              || { echo "⛔ '$spec' is not a name@version spec"; exit 1; }
          done < /tmp/slice.txt

      # ⛔ STAMPED IMMEDIATELY BEFORE MEASURING, AND NOWHERE ELSE. The verify step uses this to assert
      # each claimed spec produced a record NEWER than this instant — the only way to tell a real
      # re-measure from a spec that silently kept its pre-existing record. Stamping it earlier (at
      # checkout, or at claim time) would widen the window enough for a record written by a CONCURRENT
      # run to read as ours; both paths that write the slice converge here, so one stamp covers both.
      - name: Stamp when measurement began
        if: env.DRAINED != '1'
        shell: bash
        run: |
          set -eu
          S=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "RUN_STARTED_AT=$S" >> "$GITHUB_ENV"
          echo "measurement begins at $S — every claimed spec must hold a record newer than this"

      - name: Measure the slice
        if: env.DRAINED != '1'
        shell: bash
        env:
          # ⛔ TELL THE HARNESS WHERE THIS REPO KEEPS RECORDS. Without it, run-batch.sh writes to its
          # local-sweep default `harness/results/runs` while every later step here reads `records/` —
          # so collect-verdicts finds 0, claim-slice completes 0 rows, and the slice commits nothing.
          #
          # MEASURED on a 3-package local slice: 3 records written and all MINIMUM, while
          # `collect-verdicts --runs records` reported "collected 0 verdict(s) from 0 record file(s)".
          # This sat BEHIND the missing-`timeout` defect and produces the identical symptom — a green
          # slice that measured nothing — so fixing that one alone changed nothing observable.
          NUB_CORPUS_RUNS: ${{ github.workspace }}/records/runs
          # Recorded in every record's provenance. A binary hash is not comparable across platforms,
          # so this is what answers "was this measured before fix X?" for a multi-platform corpus.
          NUB_GIT_SHA: ${{ env.NUB_FULL_SHA }}
          # ⛔ PUBLISH EACH RECORD AS IT LANDS, not once at the end of the slice. A slice runs for
          # hours; committing only at the end meant a runner dying at minute 115 lost 100
          # measurements and nothing was visible until it finished. Per-record publishing caps the
          # loss at one package and makes progress observable while the run is still going.
          #
          # NEVER force-pushes. Record paths are unique per (platform, package, version) and add-only,
          # so concurrent runners cannot collide on one; only queue.ndjson is shared, and it is
          # RE-DERIVED from the records rather than merged. A force-push would be the one thing that
          # actually loses results — it would erase whatever another platform had just landed.
          #
          # Best effort by design: the hook always exits 0. A record that does not publish stays on
          # disk for the end-of-slice commit and the artifact.
          NUB_CORPUS_ON_RECORD: ${{ github.workspace }}/harness/publish-record.sh
          NUB_CORPUS_REPO: ${{ github.workspace }}
          NUB_CORPUS_BRANCH: ${{ github.ref_name }}
          # Pinned so the publisher and the debug sweep agree on ONE path instead of each resolving
          # TMPDIR independently. ⛔ A BASH PATH, NOT `runner.temp`: on Windows that expands to
          # `D:\\a\\_temp`, which every consumer here (publish-record.sh, the sweep step) would fail to
          # open because they all run under Git-bash, where `/tmp` is mapped and a drive path is not.
          NUB_CORPUS_MANIFEST: /tmp/nub-corpus-published.txt
        run: |
          # ⛔ STOP MEASURING BEFORE THE JOB CAP KILLS US, so the slice can still be committed.
          # A terminated job commits nothing: every measurement taken dies with the runner and the
          # rows stay claimed. run-batch.sh stops STARTING packages once the remaining budget cannot
          # hold another one (sized from the slowest package seen so far, not the average — cost
          # varies by an order of magnitude between a JS postinstall and a native build).
          # 45 minutes of headroom covers collect, mark, verify, commit and the rebase/push retries.
          CAP_MIN=350; HEADROOM_MIN=45
          export NUB_CORPUS_DEADLINE=$(( JOB_START_EPOCH + (CAP_MIN - HEADROOM_MIN) * 60 ))
          echo "build consumed $(( ($(date +%s) - JOB_START_EPOCH) / 60 )) min of the ${CAP_MIN}-min cap"
          echo "measure deadline: $(date -u -d "@$NUB_CORPUS_DEADLINE" 2>/dev/null || date -u -r "$NUB_CORPUS_DEADLINE" 2>/dev/null || echo "$NUB_CORPUS_DEADLINE")"
          # continue-on-error semantics INSIDE the batch: one package that breaks the harness must not
          # cost the other 99 measurements in this slice.
          bash harness/run-batch.sh "$NUB_BIN" ${{ (inputs.packages != '' || inputs.force) && '--force' || '' }} --file /tmp/slice.txt || echo "run-batch exited non-zero — verify-corpus decides whether that lost the slice"
          # Collect this run's verdicts for the completion step. A row whose record is missing stays
          # claimed and is reclaimed later — never silently marked done.
          node harness/collect-verdicts.mjs --runs records --out /tmp/verdicts.ndjson
          echo "records on disk after the batch: $(find records -name results.json | wc -l)"

      - name: Mark completed rows
        if: inputs.packages == '' && env.DRAINED != '1'
        shell: bash
        run: |
          node harness/claim-slice.mjs --complete /tmp/verdicts.ndjson --run "${{ github.run_id }}"
          # ⛔ THEN RECONCILE AGAINST THE RECORDS ON DISK. `--complete` only marks rows THIS run
          # claimed, which leaves every other route to a record unaccounted for: one salvaged from a
          # lost run's log, one committed by a run whose queue update never landed, one carried in
          # from an earlier corpus. MEASURED: the queue read `0/6750 done (0%)` while 158 records sat
          # committed beside it — an index that is internally consistent and says the opposite of the
          # truth. Safe by construction: it only ever marks a row DONE, and only when a record for
          # that exact (pkg, version, platform) exists.
          node harness/claim-slice.mjs --reconcile --records records

      # ⛔ A SLICE'S MEASUREMENTS MUST SURVIVE A FAILED COMMIT. Measuring 100 packages costs ~2 hours
      # of runner time; the commit that publishes them is the very last step and any earlier failure
      # takes the whole slice down with the ephemeral runner.
      #
      # MEASURED: a Linux slice measured its full 100 packages successfully, wrote them to a path the
      # commit step did not stage, and the runner was torn down — 100 real measurements gone. The
      # rows stayed `claimed` so nothing was permanently lost, but the compute was.
      #
      # `if: always()` is the whole point: this must run precisely when a later step FAILS. Uploading
      # before the gate is deliberate too — records that fail verification are exactly the ones worth
      # keeping for diagnosis.
      - name: Preserve this slice's records as an artifact
        if: always() && env.DRAINED != '1'
        uses: actions/upload-artifact@v4
        with:
          name: records-${{ inputs.os }}-${{ github.run_id }}
          path: records/
          if-no-files-found: warn
          retention-days: 30

      # ⛔ VERIFY BEFORE COMMITTING, and FAIL the run if the corpus lost substance. A slice that
      # produces records which collate to nothing is the failure this project already shipped once;
      # committing it would bury the evidence under thousands of later rows.
      # ⛔ RUNS ON DEBUG (`packages`) RUNS TOO, AND THAT EXEMPTION WAS THE BUG. This step was gated on
      # `inputs.packages == ''`, so the one check that exists to catch a measurement that did not
      # happen was SKIPPED on exactly the runs used to re-measure — and a targeted re-measure is the
      # only way to replace an already-recorded spec, so it is the path where a silent no-op does the
      # most damage. It is also cheap: `/tmp/slice.txt` is written by BOTH the claim step and the
      # debug step, so `--expect` is well-defined either way.
      - name: Verify the corpus carries what it measured
        if: env.DRAINED != '1'
        shell: bash
        run: |
          set -eu
          # ⛔ COPY THE SLICE TO A RELATIVE PATH BEFORE HANDING IT TO NODE. `/tmp/slice.txt` is fine
          # for the `wc` below because BASH reads that one — but `--expect-specs` makes NODE read it,
          # and on Windows Git Bash's `/tmp/x` is `…\AppData\Local\Temp\x` while native Node resolves
          # it against the current drive (`C:\tmp\x`). That exact mismatch cost the security probe
          # three runs before I stopped patching crossings and removed them; a relative path needs no
          # translation on any platform.
          # ⛔⛔ `--expect-specs`/`--since` ARE DELIBERATELY NOT PASSED ON A QUEUE DRAIN, AND THAT IS A
          # REVERT OF MY OWN CHANGE FROM EARLIER TODAY. The reasoning for them was sound — `--expect
          # <n>` only fires on a COMPLETELY EMPTY corpus, so it cannot see a run that claimed N specs
          # and wrote fewer — but the gate as wired FAILED TWO GOOD DARWIN DRAINS with
          # "28 of 28 claimed spec(s) still carry a record OLDER than the run".
          #
          # THE FLAW: a queue drain CLAIMS a slice, then `run-batch.sh` deliberately STOPS STARTING
          # packages once the remaining budget cannot fit one, so the job can still commit what it
          # measured before the 6h cap kills it. Stopping early is CORRECT behaviour, and the
          # unmeasured tail legitimately keeps its existing records. Requiring every claimed spec to
          # be freshly stamped turns that normal case into a red run and blocks coverage.
          #
          # ⛔ It also cannot see HARNESS-* records at all: a timed-out spec carries NO `provenance.at`
          # (verified — the timeout probe's four records all read `at: undefined`), so a missing
          # timestamp is indistinguishable from a stale one in that check.
          #
          # The flags remain in verify-corpus.mjs, tested with one positive and three negative
          # controls, for TARGETED re-measures where every claimed spec really must be replaced —
          # that is the case they were written for. A queue drain is not that case.
          node harness/verify-corpus.mjs --records records \
            --expect "$(wc -l < /tmp/slice.txt)"

      # ⛔ ASK THE REAL PARSER WHETHER THE ACCUMULATING CATALOG STILL LOADS. Everything upstream of
      # this is JavaScript checking JavaScript: collate.mjs writes a catalog and verify-corpus.mjs
      # reads it back. Neither has ever asked NUB. The unit gate in-tree
      # (crates/nub-sandbox/tests/generated_catalog_round_trip.rs) asserts a SYNTHETIC document, so
      # the catalog this corpus actually produces has never been through the parser that consumes it.
      #
      # ⛔ AND A REJECTED CATALOG DOES NOT FAIL — Decision::FellBack keeps nub running on the
      # compiled-in catalog and merely prints "REJECTED". So the failure this guards against is
      # silent by construction: records keep landing, slices keep going green, and the catalog they
      # produce quietly stops being the one in force. That is the same shape as the six defects this
      # harness already shipped.
      #
      # ⛔ THE GATE CHECKS ITSELF FIRST. A deliberately malformed catalog must be REJECTED before the
      # real one is allowed to prove anything. Without that control an absent banner — a nub that
      # never read the variable at all — would read as success, which is precisely how a vacuous
      # check passes forever.
      - name: Ask nub to parse the catalog this corpus produces
        if: inputs.packages == '' && env.DRAINED != '1'
        shell: bash
        run: |
          set -uo pipefail
          node harness/collate.mjs --runs records --out /tmp/catalog-gate.json >/dev/null 2>&1

          printf '{"packages":{"x":{"default":{"read":"disk","write":"disk"}}}}' > /tmp/catalog-bad.json
          BAD=$(NUB_BUILD_JAIL_CATALOG=/tmp/catalog-bad.json "$NUB_BIN" --version 2>&1 || true)
          case "$BAD" in
            *REJECTED*) echo "control ok — a malformed catalog is refused" ;;
            *) echo "⛔ GATE IS INERT: a deliberately malformed catalog produced no REJECTED banner." >&2
               echo "   Saw: ${BAD:-<no output>}" >&2
               echo "   Refusing to read anything into the real catalog's result." >&2
               exit 1 ;;
          esac

          GOOD=$(NUB_BUILD_JAIL_CATALOG=/tmp/catalog-gate.json "$NUB_BIN" --version 2>&1 || true)
          case "$GOOD" in
            *REJECTED*)
              echo "⛔ THE GENERATED CATALOG WAS REJECTED BY NUB — it is silently not in force." >&2
              echo "   $GOOD" >&2
              exit 1 ;;
            *OVERRIDDEN*)
              echo "the catalog this corpus produces loads in nub:"
              echo "  $GOOD" ;;
            *)
              echo "⛔ no catalog banner at all — nub did not read the override." >&2
              echo "   Saw: ${GOOD:-<no output>}" >&2
              exit 1 ;;
          esac

      # ONE COMMIT: results and queue together, so the claim and its evidence can never diverge.
      - name: Commit results and queue
        if: inputs.packages == '' && env.DRAINED != '1'
        shell: bash
        run: |
          git config user.name  "corpus-runner"
          git config user.email "corpus-runner@users.noreply.github.com"
          # ⛔ DO NOT REBASE OR MERGE. REBUILD OUR CONTENT ON TOP OF ORIGIN INSTEAD.
          #
          # MEASURED, and it killed a slice that had already passed the gate: run 30798824023
          # measured 100 packages, collected 100 verdicts and printed `CORPUS VERIFY: ok`, then died
          # on `CONFLICT (add/add)` under records/runs/linux-x64/ — its checkout predated a commit
          # that had already added some of those records, so both sides ADDED the same paths.
          #
          # The retry loop then could not possibly succeed. `git pull --rebase` leaves unmerged files
          # behind, so every later attempt failed identically with "Pulling is not possible because
          # you have unmerged files". Five attempts, one guaranteed outcome.
          #
          # Rebasing is the wrong tool because this step's output is not a patch — it is a set of
          # FILES whose identity is (platform, package, version). Two runs producing the same path is
          # not a conflict to resolve; it is two valid measurements of one cell. So: copy our records
          # aside, hard-reset onto origin, put them back, and RE-DERIVE the queue from the records
          # that now exist. Conflict-free by construction rather than by luck.
          SLICE_N=$(wc -l < /tmp/slice.txt)
          git add records queue.ndjson
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          # ⛔⛔ STASH ONLY THE RECORDS THIS RUN MEASURED — NOT THE WHOLE TREE.
          #
          # This block used to `cp -R records "$STASH/records"` and restore ALL of it over origin,
          # justified by "ours win where they overlap: a freshly measured record is at least as good
          # as the one already there". THAT PREMISE IS FALSE for the thousands of records this run
          # never touched: the checkout is hours old by the time a slice ends, so restoring the whole
          # tree REVERTS every record any other runner landed in the meantime, to a stale copy.
          #
          # MEASURED, and it destroyed a verified result: commit f749ade8
          # "corpus(macos): slice of 40 [run 30902081851]" rewrote
          # records/runs/WIN32-x64/gifsicle/5.3.0/results.json — a platform that run never measured —
          # back to a 2026-08-03 copy at 55 cells write:"disk" with `nub: undefined`, discarding the
          # 6-cell {network} measurement on 8f7d5adb67 that PROVED the AC\Temp fix.
          #
          # Same defect class as the one already fixed in harness/publish-record.sh, which is why the
          # manifest exists — but that fix only covered the PER-RECORD publish path, and this
          # END-OF-SLICE path re-introduced it at greater scope (whole tree, not just staged files).
          #
          # The manifest lists exactly the records this run wrote (publish-record.sh appends one line
          # per record, sorted-unique). Restoring only those keeps the "ours win" rule TRUE, because
          # now "ours" really is ours. Falls back to the whole tree only if the manifest is missing —
          # publishing something beats losing this slice, and that path is the old behaviour.
          MANIFEST="${NUB_CORPUS_MANIFEST:-${TMPDIR:-/tmp}/nub-corpus-published.txt}"
          STASH=$(mktemp -d)
          if [ -s "$MANIFEST" ]; then
            # ⛔ MANIFEST ENTRIES ARE DIRECTORIES, NOT FILES. publish-record.sh writes
            # `REL="${REC_DIR#"$REPO"/}"` — a RECORD DIR like `records/runs/win32-x64/gifsicle/5.3.0`,
            # which holds results.json plus that cell's logs. An earlier version of this block tested
            # `[ -f "$rel" ]`, which is FALSE for a directory, so it would have skipped every entry,
            # stashed nothing, and restored nothing — LOSING this run's records instead of merely
            # reverting other runners'. Strictly worse than the bug it replaced.
            # Nothing else caught it because the other consumer, `git add -- <path>`, takes a
            # directory perfectly happily.
            while IFS= read -r rel; do
              [ -e "$rel" ] || continue
              mkdir -p "$STASH/$rel"
              cp -R "$rel/." "$STASH/$rel/" 2>/dev/null || true
            done < "$MANIFEST"
            echo "stashing $(wc -l < "$MANIFEST" | tr -d ' ') record dir(s) this run measured"
          else
            echo "::warning::no publish manifest — falling back to stashing the whole records tree, which can revert other runners' records"
            mkdir -p "$STASH/records"
            cp -R records/. "$STASH/records/"
          fi
          for i in 1 2 3 4 5; do
            git reset -q --hard HEAD
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            # Ours win where they overlap — and after the change above, "ours" means only the records
            # this run actually produced.
            if [ -s "$MANIFEST" ]; then
              # Directories, matching the stash above — see the note there.
              while IFS= read -r rel; do
                [ -d "$STASH/$rel" ] || continue
                mkdir -p "$rel"
                cp -R "$STASH/$rel/." "$rel/" 2>/dev/null || true
              done < "$MANIFEST"
            else
              cp -R "$STASH/records/." records/
            fi
            # ⛔ RE-DERIVE the queue rather than carrying our copy across. Origin's queue may hold
            # another platform's claims made while this slice ran, and overwriting it would silently
            # release their rows. Reconcile only ever marks a row done, and only when a record for
            # that exact cell exists.
            node harness/claim-slice.mjs --reconcile --records records
            git add records queue.ndjson
            git diff --cached --quiet && { echo "already up to date after reconcile"; exit 0; }
            git commit -q -m "corpus(${{ inputs.os }}): slice of $SLICE_N [run ${{ github.run_id }}]"
            git push -q && exit 0
            echo "push $i rejected — another runner landed first; rebuilding on the new head" >&2
            sleep $((i * 5))
          done
          echo "could not push after 5 attempts" >&2; exit 1

      # ⛔ A DEBUG RUN HAS NO SAFETY NET, AND THAT SILENTLY LOSES MEASUREMENTS.
      #
      # Per-record publishing is BEST EFFORT — publish-record.sh gives up after three rejections and
      # says "publish deferred (branch busy)". For a QUEUE slice that is harmless: the end-of-slice
      # commit above sweeps up whatever deferred. A DEBUG run skips that step entirely, so a deferred
      # record exists only in the artifact and never reaches the corpus.
      #
      # MEASURED: a debug run re-measured five detox versions and all five produced `2 cells,
      # (nothing)`. FOUR landed on main and are still correct 9-16 record-commits later.
      # detox@22.0.0-rc.0 did not — and the regression detector showed ZERO records rewritten in that
      # window, so it was not reverted, it was never published. The verification read as a partial
      # failure when the measurement had actually succeeded.
      #
      # Stages ONLY the paths in this run's manifest — the same list publish-record.sh maintains — so
      # it cannot re-stage a stale copy of somebody else's record, which is the bug that manifest
      # exists to prevent. Never touches queue.ndjson: a debug run claims nothing and must complete
      # nothing.
      - name: Sweep up any debug record whose per-record publish deferred
        if: inputs.packages != ''
        shell: bash
        run: |
          MANIFEST="/tmp/nub-corpus-published.txt"
          [ -s "$MANIFEST" ] || { echo "no manifest — nothing was published, nothing to sweep"; exit 0; }
          git config user.name  "corpus-runner"
          git config user.email "corpus-runner@users.noreply.github.com"
          STASH=$(mktemp -d); cp -R records "$STASH/records"
          for i in 1 2 3 4 5; do
            git reset -q --hard HEAD
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            cp -R "$STASH/records/." records/
            xargs -I{} git add --ignore-removal -- "{}" < "$MANIFEST" 2>/dev/null
            git diff --cached --quiet && { echo "every debug record already on origin"; exit 0; }
            git commit -q -m "corpus(debug): sweep records deferred by the per-record publish [run ${{ github.run_id }}]"
            git push -q && { echo "swept $(wc -l < "$MANIFEST") manifest path(s)"; exit 0; }
            echo "sweep push $i rejected — rebuilding on the new head" >&2
            sleep $((i * 5))
          done
          echo "could not sweep after 5 attempts — records remain in the artifact" >&2

      - name: Report queue status
        if: inputs.packages == ''
        shell: bash
        run: node harness/claim-slice.mjs --status

      # Chain the next slice. Self-dispatch rather than a cron so the corpus advances as fast as the
      # runners allow, and stops the moment its OS is drained.
      - name: Dispatch the next slice
        if: inputs.packages == '' && inputs.chain && env.DRAINED != '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          # ⛔⛔ ADOPT THE CURRENT TIP RATHER THAN FORWARDING OUR OWN SHA FOREVER.
          #
          # This line used to pass `${{ inputs.nub_sha }}` verbatim, so a chain launched at some
          # commit re-dispatched itself on that commit INDEFINITELY and could never pick up a fix.
          # That froze whole platforms on fixless binaries TWICE, and both times the records produced
          # in between had to be thrown away and re-measured:
          #   - windows sat 18h on 666a4aadfe, which contained NONE of the five then-current fixes;
          #   - macos then did the same — 22 of its 24 write:"disk" records were on 666a4aadfe,
          #     including appium-uiautomator2-driver at FIVE versions, which 40241eabcd was measured
          #     to move from 55 cells write:"disk" to 18 cells read:"disk".
          #
          # ⛔ THE PINNING WAS DELIBERATE AND ITS TWO REASONS ARE REAL — this trades them knowingly:
          #  1. "keeps a chain's records comparable" — but every record already carries
          #     `provenance.nubGitSha`, so a chain spanning two binaries is RECORDED, not silent, and
          #     the collator reads per-record provenance rather than assuming a chain is uniform.
          #  2. "re-resolving each hop pays a cold rebuild (~26 min on Windows)" — but that is paid
          #     ONCE PER NEW TIP PER PLATFORM, after which the sha-keyed cache hits on every later
          #     hop. The staleness it prevented cost far more: hours of measurement re-run wholesale,
          #     twice.
          # The direction of error also favours rolling forward: a NEWER binary carries MORE fixes and
          # therefore grants NARROWER. Staying stale over-grants — safe, but it wastes the measurement.
          #
          # Falls back to our own sha when the remote is unreachable: a chain must never die on a
          # network blip, and measuring the old commit for one more hop is exactly the status quo.
          TIP=$(git ls-remote https://github.com/nubjs/nub.git sandbox/integration 2>/dev/null | cut -f1 || true)
          NEXT="${TIP:-${{ inputs.nub_sha }}}"
          if [ "$NEXT" != "${{ inputs.nub_sha }}" ]; then
            echo "chain rolling forward: ${{ inputs.nub_sha }} -> ${NEXT:0:10}"
          fi
          gh workflow run corpus-queue-runner.yml \
            -f os="${{ inputs.os }}" -f slice="${{ inputs.slice }}" \
            -f nub_sha="$NEXT" -f chain=true -f force=${{ inputs.force }}
