# Pop a slice off the queue, measure it, commit the results AND the queue update together.
#
# THE SHAPE: one job = one OS = one slice. It claims N pending rows for its OS, runs them, then
# commits `records/` and `queue.ndjson` in ONE commit. That single commit is what makes a claim
# durable: a run that dies mid-slice leaves its rows `claimed` with its run id — attributable and
# reclaimable — rather than silently lost or double-run.
#
# ⛔ WHY SLICES AND NOT ONE BIG FAN-OUT. A 6,750-row corpus dispatched as one matrix is
# unobservable, unresumable, and loses everything an expiring artifact held. Slices are small enough
# that a failure costs ~100 runs, the queue file shows coverage at a glance, and the records land in
# git as they are produced.
#
# ⛔ RUNNERS ARE FULLY PARALLEL, ACROSS AND WITHIN AN OS. What makes that safe is that a claim is
# PUSHED before any measuring starts, so two runners can never hold the same row: a loser re-claims
# against the queue that already carries the winner's claim and takes different rows. Records are
# add-only and unique per (platform, package, version), so the only shared file is the queue, and
# every writer re-derives it from origin rather than merging its own copy in.

name: corpus-queue-runner

on:
  workflow_dispatch:
    inputs:
      os:
        description: which operating system to measure
        type: choice
        options: [linux, macos, windows]
        required: true
      slice:
        description: how many queue rows to claim
        type: string
        default: "100"
      nub_sha:
        description: nubjs/nub commit to build the probe binary from
        type: string
        required: true
      chain:
        description: re-dispatch itself while the queue still has pending rows
        type: boolean
        default: true

concurrency:
  # ⛔ SAME-OS RUNNERS NOW RUN IN PARALLEL. They used to be serialised because a claim lived only in
  # the claiming runner's working tree until the end of its slice, so a second runner read the same
  # pending rows and measured the same packages — measured on a local rig: three concurrent runners
  # claiming 4 rows each from a 10-row queue took the IDENTICAL 4, i.e. 4 distinct of 12. Parallelism
  # bought nothing at all. With the claim published before measuring, the same rig gives 10 distinct
  # of 10.
  #
  # This is the only lever that moves Windows: 2,250 rows at the measured 13.2 min/package is ~23 days
  # serialised, and divides directly by the number of concurrent runners.
  #
  # The group is keyed on the RUN so nothing is ever cancelled — an interrupted job would strand its
  # claim until --reclaim-stale ages it out six hours later.
  group: corpus-queue-${{ inputs.os }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  slice:
    runs-on: >-
      ${{ inputs.os == 'linux' && 'ubuntu-latest'
       || inputs.os == 'macos' && 'macos-latest'
       || 'windows-latest' }}
    timeout-minutes: 350
    permissions:
      contents: write        # commits results + queue back
      actions: write         # re-dispatches itself when chaining
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # The probe binary comes from nubjs/nub at an explicit SHA, never from a floating branch: every
      # record's provenance names the nub it measured, and an old corpus must stay reproducible.
      # ⛔ STAMP THE JOB'S START BEFORE THE BUILD — the measure deadline is relative to THE JOB, and
      # the build is the largest and most variable slice of it (~20 min warm, ~90 min cold on
      # Windows). This step sat AFTER the build at first, which made the deadline measure-relative
      # again and the guard inert: it would have granted the full remaining budget on top of whatever
      # the build had already spent, overrunning the very cap it exists to respect.
      - name: Stamp the job start
        shell: bash
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      # ⛔ CLONE BEFORE THE CACHE RESTORE. `git clone` refuses a non-empty destination, and
      # rust-cache restores `target/` INTO the workspace path — so with the clone second, the very
      # first cache HIT would fail the build. That ordering survived only because the cache never
      # hit (see the key defect below), which is the worst kind of latent bug: harmless until the
      # thing it depends on starts working.
      #
      # No credential is involved. nubjs/nub is PUBLIC, so this is an anonymous HTTPS clone and the
      # GITHUB_TOKEN's same-repo scope never applies. ⛔ IF NUB EVER GOES PRIVATE THIS BREAKS and
      # needs a PAT or deploy key.
      #
      # `--filter=blob:none` rather than `--depth 1`: the sha we want lives on a feature branch, not
      # on the default branch, so a depth-1 clone of main then had to fetch the sha separately and
      # download main's tree for nothing. A blobless partial clone fetches commits/trees now and
      # blobs on demand, so checking out any sha works without a second fetch.
      - name: Clone nub at the requested commit
        shell: bash
        run: |
          set -eux
          git clone --filter=blob:none --no-checkout https://github.com/nubjs/nub.git /tmp/nub
          cd /tmp/nub
          git checkout --detach "${{ inputs.nub_sha }}"
          git log --oneline -1

      # ⛔ THE KEY MUST NOT INCLUDE THE NUB SHA. It did, and that made every new nub commit a
      # guaranteed MISS — which is precisely backwards for a build cache. My original reasoning was
      # "a cache hit is only correct for the exact source", and that conflates the CACHE with the
      # ARTIFACT: restoring a warm target dir cannot produce a wrong binary, because cargo decides
      # what to rebuild from content. rust-cache's own key already folds in Cargo.lock and the rustc
      # version, which is the correctness boundary that actually matters.
      #
      # MEASURED with the sha in the key: macOS restored in 0.0 min (nothing there) and then built
      # for 13.5 min; the first Windows run built for 27.6 min. Every run paid full freight.
      #
      # `cache-on-failure` is load-bearing here too. It defaults to FALSE, and this workflow's runs
      # were failing at the COMMIT step — after a perfectly good build — so the cache was discarded
      # every time. A slice that measured 100 packages and lost the push should not also throw away
      # its compilation.
      # ⛔ CACHE THE BUILT BINARY, KEYED ON THE NUB COMMIT — and note this is the exact INVERSE of
      # the rule for the compile cache below. A commit sha is the WRONG key for a compile cache,
      # because cargo already decides what to rebuild from content and keying on the sha guarantees a
      # miss on every new commit. It is the RIGHT key for an ARTIFACT cache, because a binary really
      # is a pure function of (commit, platform, features) — the same inputs can only produce the
      # same nub.
      #
      # MEASURED, and this is why it is worth a second cache: rust-cache alone took a Linux build
      # from 12.4 min cold to 11.2 min warm — about 10%. That is rust-cache working as designed, not
      # a defect: it caches DEPENDENCY artifacts and deliberately prunes workspace crates, and nub's
      # own workspace is the bulk of the compile. Restoring the finished binary skips all of it.
      #
      # Over the ~60 slices still needed to drain the corpus that is roughly 12 hours of runner time
      # that produces nothing.
      # ⛔ RESTORE AND SAVE ARE SEPARATE STEPS, AND THAT IS NOT A STYLE CHOICE. With a single
      # `actions/cache`, the save runs as a POST step — and post steps run in REVERSE registration
      # order, so `Post Cache the probe build` (rust-cache) runs BEFORE this one. rust-cache's post
      # step PRUNES WORKSPACE CRATE ARTIFACTS, which deletes `target/release/nub`, so by the time the
      # binary cache tried to save there was nothing there:
      #
      #     Path Validation Error: Path(s) specified in the action for caching do(es) not exist,
      #     hence no cache is saved.
      #
      # The cache could therefore never populate, and every run rebuilt while looking like it had a
      # cache configured. MEASURED on two consecutive probes: the second restored in 0.0 min and
      # rebuilt from scratch. Saving explicitly in the MAIN phase, immediately after the build, puts
      # it beyond the reach of any post-step cleanup.
      - name: Restore a previously built nub for this exact commit
        id: nubbin
        uses: actions/cache/restore@v4
        with:
          path: /tmp/nub/target/release/nub${{ inputs.os == 'windows' && '.exe' || '' }}
          # `v1` is a manual epoch: bump it if the build FLAGS change, since the flags are not in the
          # key and a stale binary built with different features would be silently wrong.
          key: nub-bin-v1-${{ inputs.os }}-${{ inputs.nub_sha }}

      - name: Cache the probe build
        # Skipped on a binary hit: there is nothing left to compile, so restoring a dependency cache
        # and saving it again at job end is pure cost. It also removes any chance of rust-cache's
        # archive extracting over the binary restored above — same target/ dir, and ordering that
        # depends on what another action happens to put in its tarball is not a thing to rely on.
        if: steps.nubbin.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: /tmp/nub
          shared-key: corpus-probe-${{ inputs.os }}
          cache-on-failure: true

      - name: Build the probe binary
        # Skipped entirely when the binary for this exact commit was restored above.
        if: steps.nubbin.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -eux
          cd /tmp/nub
          cargo build --release -p nub-cli --features nub-cli/build-jail-catalog-override
          echo "NUB_BIN=/tmp/nub/target/release/nub${{ inputs.os == 'windows' && '.exe' || '' }}" >> "$GITHUB_ENV"

      # Save NOW, in the main phase, while the binary still exists — see the restore step above for
      # why a post-phase save silently never happened.
      - name: Save the built nub for the next slice
        if: steps.nubbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/nub/target/release/nub${{ inputs.os == 'windows' && '.exe' || '' }}
          key: nub-bin-v1-${{ inputs.os }}-${{ inputs.nub_sha }}

      # ⛔ SET NUB_BIN ON THE CACHE-HIT PATH TOO. The build step above is skipped on a hit, and it is
      # the step that exports NUB_BIN — so without this the whole slice would run with an empty
      # binary path. A cache hit making the job fail would be a memorable way to learn this.
      - name: Point at the restored binary
        if: steps.nubbin.outputs.cache-hit == 'true'
        shell: bash
        run: |
          BIN=/tmp/nub/target/release/nub${{ inputs.os == 'windows' && '.exe' || '' }}
          chmod +x "$BIN" 2>/dev/null || true
          # Prove it RUNS before trusting it. A restored file of the right size that cannot execute
          # would otherwise surface as a confusing failure much later, inside the first measurement.
          "$BIN" --version
          echo "NUB_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Reclaim rows stranded by a dead run
        shell: bash
        run: node harness/claim-slice.mjs --reclaim-stale 360

      - name: Claim a slice
        shell: bash
        run: |
          # ⛔ WINDOWS MEASURES ~13x SLOWER PER PACKAGE, SO IT CANNOT TAKE THE SAME SLICE.
          #
          # MEASURED on the one Windows run that completed (nubjs/nub 30790327108, shard 20/150):
          # 15 packages in a 198-minute probe step = 13.2 min/package. A 100-package slice therefore
          # needs ~1,320 minutes of measuring against this job's 350-minute cap — so every Windows
          # slice would hit the cap having measured ~20, commit NOTHING, leave 100 rows claimed, and
          # kill the chain. Windows could never finish a slice at all.
          #
          # Claiming fewer rows is the primary fix, because a row claimed and then abandoned is worse
          # than one never claimed: it is unavailable until --reclaim-stale ages it out 6 hours later.
          # The deadline guard in the measure step is the safety net for when this estimate is wrong.
          SLICE="${{ inputs.slice }}"
          if [ "${{ inputs.os }}" = "windows" ] && [ "$SLICE" -gt 20 ]; then
            echo "windows: clamping slice $SLICE -> 20 (13.2 min/package measured; 350-min job cap)"
            SLICE=20
          fi
          # ⛔ PUBLISH THE CLAIM BEFORE MEASURING ANYTHING. The claim used to live only in this
          # runner's working tree until the end-of-slice commit, so a second runner on the same OS
          # read the same pending rows and measured the same packages. That is the reason same-OS
          # runs have to be serialised, and serialisation is what puts Windows at roughly 23 days for
          # its 2,250 rows at the measured 13.2 min/package.
          #
          # Pushing the claim first makes it exclusive, which is what lets runners be parallel. Each
          # retry RE-CLAIMS against the queue it just fetched rather than re-pushing the same rows:
          # --claim only ever takes `pending` rows, so a loser automatically picks up rows the winner
          # did not take and the two converge on disjoint slices with no coordination.
          #
          # Taking origin's queue.ndjson VERBATIM each round is what keeps that safe. Carrying a
          # locally-modified copy across the retry would replay my claim over a queue that has since
          # gained other runners' claims, and writing that back would silently release their rows.
          git config user.name corpus-runner
          git config user.email corpus-runner@users.noreply.github.com
          CLAIMED=0
          for attempt in 1 2 3 4 5 6; do
            # ⛔ A MIXED RESET (the default), NOT --soft. --soft leaves the INDEX as it was at
            # checkout, so the commit carries that whole stale tree — including a copy of
            # .github/workflows/ from before any workflow edit that landed while this job was
            # building. GITHUB_TOKEN may not modify workflow files, so every push is rejected:
            #
            #     ! [remote rejected] HEAD -> main (refusing to allow a GitHub App to create or
            #       update workflow .github/workflows/corpus-queue-runner.yml without `workflows`
            #       permission)
            #
            # All six attempts then fail identically and the job refuses to measure. MEASURED: run
            # 30846653540 burned a full 12-minute build and died here. A mixed reset points HEAD at
            # origin AND clears the index, leaving the working tree alone, so only the queue this
            # step explicitly stages reaches the commit.
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q "origin/$GITHUB_REF_NAME"
            git checkout -q "origin/$GITHUB_REF_NAME" -- queue.ndjson
            node harness/claim-slice.mjs \
              --claim "$SLICE" --os "${{ inputs.os }}" --run "${{ github.run_id }}" \
              > /tmp/slice.txt
            # An empty slice means this OS is finished. Nothing to publish, so do not push.
            if [ ! -s /tmp/slice.txt ]; then
              echo "DRAINED=1" >> "$GITHUB_ENV"
              CLAIMED=1
              break
            fi
            N=$(wc -l < /tmp/slice.txt | tr -d ' ')
            git add queue.ndjson
            git commit -q -m "corpus(${{ inputs.os }}): claim $N rows [run ${{ github.run_id }}]"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              CLAIMED=1
              echo "claimed $N rows"
              break
            fi
            echo "claim push $attempt rejected — re-claiming against the new head" >&2
            sleep $((attempt * 4))
          done
          # ⛔ FAIL rather than measure on an unpublished claim. Carrying on would duplicate whatever
          # another runner is already measuring: a whole job spent producing records that already
          # exist, and no progress on the queue.
          if [ "$CLAIMED" != "1" ]; then
            echo "could not publish a claim after 6 attempts — refusing to measure" >&2
            exit 1
          fi

      - name: Measure the slice
        if: env.DRAINED != '1'
        shell: bash
        env:
          # ⛔ TELL THE HARNESS WHERE THIS REPO KEEPS RECORDS. Without it, run-batch.sh writes to its
          # local-sweep default `harness/results/runs` while every later step here reads `records/` —
          # so collect-verdicts finds 0, claim-slice completes 0 rows, and the slice commits nothing.
          #
          # MEASURED on a 3-package local slice: 3 records written and all MINIMUM, while
          # `collect-verdicts --runs records` reported "collected 0 verdict(s) from 0 record file(s)".
          # This sat BEHIND the missing-`timeout` defect and produces the identical symptom — a green
          # slice that measured nothing — so fixing that one alone changed nothing observable.
          NUB_CORPUS_RUNS: ${{ github.workspace }}/records/runs
          # Recorded in every record's provenance. A binary hash is not comparable across platforms,
          # so this is what answers "was this measured before fix X?" for a multi-platform corpus.
          NUB_GIT_SHA: ${{ inputs.nub_sha }}
          # ⛔ PUBLISH EACH RECORD AS IT LANDS, not once at the end of the slice. A slice runs for
          # hours; committing only at the end meant a runner dying at minute 115 lost 100
          # measurements and nothing was visible until it finished. Per-record publishing caps the
          # loss at one package and makes progress observable while the run is still going.
          #
          # NEVER force-pushes. Record paths are unique per (platform, package, version) and add-only,
          # so concurrent runners cannot collide on one; only queue.ndjson is shared, and it is
          # RE-DERIVED from the records rather than merged. A force-push would be the one thing that
          # actually loses results — it would erase whatever another platform had just landed.
          #
          # Best effort by design: the hook always exits 0. A record that does not publish stays on
          # disk for the end-of-slice commit and the artifact.
          NUB_CORPUS_ON_RECORD: ${{ github.workspace }}/harness/publish-record.sh
          NUB_CORPUS_REPO: ${{ github.workspace }}
          NUB_CORPUS_BRANCH: ${{ github.ref_name }}
        run: |
          # ⛔ STOP MEASURING BEFORE THE JOB CAP KILLS US, so the slice can still be committed.
          # A terminated job commits nothing: every measurement taken dies with the runner and the
          # rows stay claimed. run-batch.sh stops STARTING packages once the remaining budget cannot
          # hold another one (sized from the slowest package seen so far, not the average — cost
          # varies by an order of magnitude between a JS postinstall and a native build).
          # 45 minutes of headroom covers collect, mark, verify, commit and the rebase/push retries.
          CAP_MIN=350; HEADROOM_MIN=45
          export NUB_CORPUS_DEADLINE=$(( JOB_START_EPOCH + (CAP_MIN - HEADROOM_MIN) * 60 ))
          echo "build consumed $(( ($(date +%s) - JOB_START_EPOCH) / 60 )) min of the ${CAP_MIN}-min cap"
          echo "measure deadline: $(date -u -d "@$NUB_CORPUS_DEADLINE" 2>/dev/null || date -u -r "$NUB_CORPUS_DEADLINE" 2>/dev/null || echo "$NUB_CORPUS_DEADLINE")"
          # continue-on-error semantics INSIDE the batch: one package that breaks the harness must not
          # cost the other 99 measurements in this slice.
          bash harness/run-batch.sh "$NUB_BIN" --file /tmp/slice.txt || echo "run-batch exited non-zero — verify-corpus decides whether that lost the slice"
          # Collect this run's verdicts for the completion step. A row whose record is missing stays
          # claimed and is reclaimed later — never silently marked done.
          node harness/collect-verdicts.mjs --runs records --out /tmp/verdicts.ndjson
          echo "records on disk after the batch: $(find records -name results.json | wc -l)"

      - name: Mark completed rows
        if: env.DRAINED != '1'
        shell: bash
        run: |
          node harness/claim-slice.mjs --complete /tmp/verdicts.ndjson --run "${{ github.run_id }}"
          # ⛔ THEN RECONCILE AGAINST THE RECORDS ON DISK. `--complete` only marks rows THIS run
          # claimed, which leaves every other route to a record unaccounted for: one salvaged from a
          # lost run's log, one committed by a run whose queue update never landed, one carried in
          # from an earlier corpus. MEASURED: the queue read `0/6750 done (0%)` while 158 records sat
          # committed beside it — an index that is internally consistent and says the opposite of the
          # truth. Safe by construction: it only ever marks a row DONE, and only when a record for
          # that exact (pkg, version, platform) exists.
          node harness/claim-slice.mjs --reconcile --records records

      # ⛔ A SLICE'S MEASUREMENTS MUST SURVIVE A FAILED COMMIT. Measuring 100 packages costs ~2 hours
      # of runner time; the commit that publishes them is the very last step and any earlier failure
      # takes the whole slice down with the ephemeral runner.
      #
      # MEASURED: a Linux slice measured its full 100 packages successfully, wrote them to a path the
      # commit step did not stage, and the runner was torn down — 100 real measurements gone. The
      # rows stayed `claimed` so nothing was permanently lost, but the compute was.
      #
      # `if: always()` is the whole point: this must run precisely when a later step FAILS. Uploading
      # before the gate is deliberate too — records that fail verification are exactly the ones worth
      # keeping for diagnosis.
      - name: Preserve this slice's records as an artifact
        if: always() && env.DRAINED != '1'
        uses: actions/upload-artifact@v4
        with:
          name: records-${{ inputs.os }}-${{ github.run_id }}
          path: records/
          if-no-files-found: warn
          retention-days: 30

      # ⛔ VERIFY BEFORE COMMITTING, and FAIL the run if the corpus lost substance. A slice that
      # produces records which collate to nothing is the failure this project already shipped once;
      # committing it would bury the evidence under thousands of later rows.
      - name: Verify the corpus carries what it measured
        if: env.DRAINED != '1'
        shell: bash
        run: node harness/verify-corpus.mjs --records records --expect "$(wc -l < /tmp/slice.txt)"

      # ⛔ ASK THE REAL PARSER WHETHER THE ACCUMULATING CATALOG STILL LOADS. Everything upstream of
      # this is JavaScript checking JavaScript: collate.mjs writes a catalog and verify-corpus.mjs
      # reads it back. Neither has ever asked NUB. The unit gate in-tree
      # (crates/nub-sandbox/tests/generated_catalog_round_trip.rs) asserts a SYNTHETIC document, so
      # the catalog this corpus actually produces has never been through the parser that consumes it.
      #
      # ⛔ AND A REJECTED CATALOG DOES NOT FAIL — Decision::FellBack keeps nub running on the
      # compiled-in catalog and merely prints "REJECTED". So the failure this guards against is
      # silent by construction: records keep landing, slices keep going green, and the catalog they
      # produce quietly stops being the one in force. That is the same shape as the six defects this
      # harness already shipped.
      #
      # ⛔ THE GATE CHECKS ITSELF FIRST. A deliberately malformed catalog must be REJECTED before the
      # real one is allowed to prove anything. Without that control an absent banner — a nub that
      # never read the variable at all — would read as success, which is precisely how a vacuous
      # check passes forever.
      - name: Ask nub to parse the catalog this corpus produces
        if: env.DRAINED != '1'
        shell: bash
        run: |
          set -uo pipefail
          node harness/collate.mjs --runs records --out /tmp/catalog-gate.json >/dev/null 2>&1

          printf '{"packages":{"x":{"default":{"read":"disk","write":"disk"}}}}' > /tmp/catalog-bad.json
          BAD=$(NUB_BUILD_JAIL_CATALOG=/tmp/catalog-bad.json "$NUB_BIN" --version 2>&1 || true)
          case "$BAD" in
            *REJECTED*) echo "control ok — a malformed catalog is refused" ;;
            *) echo "⛔ GATE IS INERT: a deliberately malformed catalog produced no REJECTED banner." >&2
               echo "   Saw: ${BAD:-<no output>}" >&2
               echo "   Refusing to read anything into the real catalog's result." >&2
               exit 1 ;;
          esac

          GOOD=$(NUB_BUILD_JAIL_CATALOG=/tmp/catalog-gate.json "$NUB_BIN" --version 2>&1 || true)
          case "$GOOD" in
            *REJECTED*)
              echo "⛔ THE GENERATED CATALOG WAS REJECTED BY NUB — it is silently not in force." >&2
              echo "   $GOOD" >&2
              exit 1 ;;
            *OVERRIDDEN*)
              echo "the catalog this corpus produces loads in nub:"
              echo "  $GOOD" ;;
            *)
              echo "⛔ no catalog banner at all — nub did not read the override." >&2
              echo "   Saw: ${GOOD:-<no output>}" >&2
              exit 1 ;;
          esac

      # ONE COMMIT: results and queue together, so the claim and its evidence can never diverge.
      - name: Commit results and queue
        if: env.DRAINED != '1'
        shell: bash
        run: |
          git config user.name  "corpus-runner"
          git config user.email "corpus-runner@users.noreply.github.com"
          # ⛔ DO NOT REBASE OR MERGE. REBUILD OUR CONTENT ON TOP OF ORIGIN INSTEAD.
          #
          # MEASURED, and it killed a slice that had already passed the gate: run 30798824023
          # measured 100 packages, collected 100 verdicts and printed `CORPUS VERIFY: ok`, then died
          # on `CONFLICT (add/add)` under records/runs/linux-x64/ — its checkout predated a commit
          # that had already added some of those records, so both sides ADDED the same paths.
          #
          # The retry loop then could not possibly succeed. `git pull --rebase` leaves unmerged files
          # behind, so every later attempt failed identically with "Pulling is not possible because
          # you have unmerged files". Five attempts, one guaranteed outcome.
          #
          # Rebasing is the wrong tool because this step's output is not a patch — it is a set of
          # FILES whose identity is (platform, package, version). Two runs producing the same path is
          # not a conflict to resolve; it is two valid measurements of one cell. So: copy our records
          # aside, hard-reset onto origin, put them back, and RE-DERIVE the queue from the records
          # that now exist. Conflict-free by construction rather than by luck.
          SLICE_N=$(wc -l < /tmp/slice.txt)
          git add records queue.ndjson
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          STASH=$(mktemp -d)
          cp -R records "$STASH/records"
          for i in 1 2 3 4 5; do
            git reset -q --hard HEAD
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            # Ours win where they overlap: a freshly measured record is at least as good as the one
            # already there, and both describe the same cell.
            cp -R "$STASH/records/." records/
            # ⛔ RE-DERIVE the queue rather than carrying our copy across. Origin's queue may hold
            # another platform's claims made while this slice ran, and overwriting it would silently
            # release their rows. Reconcile only ever marks a row done, and only when a record for
            # that exact cell exists.
            node harness/claim-slice.mjs --reconcile --records records
            git add records queue.ndjson
            git diff --cached --quiet && { echo "already up to date after reconcile"; exit 0; }
            git commit -q -m "corpus(${{ inputs.os }}): slice of $SLICE_N [run ${{ github.run_id }}]"
            git push -q && exit 0
            echo "push $i rejected — another runner landed first; rebuilding on the new head" >&2
            sleep $((i * 5))
          done
          echo "could not push after 5 attempts" >&2; exit 1

      - name: Report queue status
        shell: bash
        run: node harness/claim-slice.mjs --status

      # Chain the next slice. Self-dispatch rather than a cron so the corpus advances as fast as the
      # runners allow, and stops the moment its OS is drained.
      - name: Dispatch the next slice
        if: inputs.chain && env.DRAINED != '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          gh workflow run corpus-queue-runner.yml \
            -f os="${{ inputs.os }}" -f slice="${{ inputs.slice }}" \
            -f nub_sha="${{ inputs.nub_sha }}" -f chain=true
