# Artifact-only three-OS acceptance of the corpus's current catalog. This never measures,
# collates, promotes, claims, or changes corpus data: it only proves existing grants against
# real installs and retains enough provenance to re-run the exact comparison.
name: Zero sandbox catalog sanity

on:
  push:
    branches: [probe/zero-sandbox-catalog-sanity]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: exact nubjs/nub candidate to test
        required: true
        default: '1daa98c23343cd50563823cdf3a2dc3230343b3e'
      baseline_sha:
        description: exact matched nubjs/nub baseline to retain beside the candidate
        required: true
        default: '66d094771559a86642db4eef4a325b6c46f21ebe'

permissions:
  contents: read

jobs:
  sanity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    # Two serialized subjects each permit 77 minutes for packages.mjs's fourteen cold arms plus
    # two five-minute denial fixtures; this leaves ~26 minutes for source-pair builds and setup.
    timeout-minutes: 210
    defaults:
      run:
        shell: bash
    env:
      CANDIDATE_REF: ${{ inputs.candidate_sha || '1daa98c23343cd50563823cdf3a2dc3230343b3e' }}
      BASELINE_REF: ${{ inputs.baseline_sha || '66d094771559a86642db4eef4a325b6c46f21ebe' }}
      CORPUS_REF: ${{ github.sha }}
      NODE_VERSION: '22.23.2'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'

      - name: Check the manifest instrument
        run: node --test harness/v2/catalog-sanity-manifest.test.mjs harness/v2/catalog-sanity-subject.test.mjs harness/v2/catalog-sanity-network.test.mjs harness/osv-screen.test.mjs

      - name: Resolve the two public Nub subjects
        run: |
          set -euo pipefail
          resolve_subject() {
            local ref="$1" dir="$2"
            git init "$dir" >&2
            git -C "$dir" remote add origin https://github.com/nubjs/nub.git >&2
            git -C "$dir" fetch --depth=1 origin "$ref" >&2
            git -C "$dir" checkout --detach FETCH_HEAD >&2
            git -C "$dir" rev-parse HEAD
          }
          CANDIDATE_SHA="$(resolve_subject "$CANDIDATE_REF" /tmp/nub-candidate)"
          BASELINE_SHA="$(resolve_subject "$BASELINE_REF" /tmp/nub-baseline)"
          printf '%s\n' "$CANDIDATE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          printf '%s\n' "$BASELINE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          printf '%s\n' "$CORPUS_REF" | grep -Eq '^[a-f0-9]{40}$'
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"

      - name: Check the actual package fixture orchestration
        run: node --test /tmp/nub-candidate/tests/build-jail-corpus/packages.test.mjs

      - name: Resolve native subject-target cache paths
        run: |
          set -euo pipefail
          candidate=/tmp/nub-catalog-sanity-target/candidate
          baseline=/tmp/nub-catalog-sanity-target/baseline
          if command -v cygpath >/dev/null 2>&1; then
            candidate="$(cygpath -w "$candidate")"
            baseline="$(cygpath -w "$baseline")"
          fi
          echo "CANDIDATE_TARGET_CACHE_PATH=$candidate" >> "$GITHUB_ENV"
          echo "BASELINE_TARGET_CACHE_PATH=$baseline" >> "$GITHUB_ENV"

      - name: Restore candidate build target
        id: candidate-target
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CANDIDATE_TARGET_CACHE_PATH }}
          key: zero-sandbox-catalog-sanity-v2-${{ runner.os }}-candidate-${{ env.CANDIDATE_SHA }}

      - name: Restore baseline build target
        id: baseline-target
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BASELINE_TARGET_CACHE_PATH }}
          key: zero-sandbox-catalog-sanity-v2-${{ runner.os }}-baseline-${{ env.BASELINE_SHA }}

      - name: Build matching full subjects
        run: |
          set -euo pipefail
          REPORTS="$GITHUB_WORKSPACE/reports"
          mkdir -p "$REPORTS"
          { git rev-parse HEAD; node --version; npm --version; rustc -Vv; uname -a; } > "$REPORTS/environment.txt"
          node harness/v2/instrument.mjs --json > "$REPORTS/instrument.json"
          build_subject() {
            local source="$1" output="$2" target="$3"
            (
              cd "$source"
              export CARGO_TARGET_DIR="$target"
              npm install --no-audit --no-fund --loglevel=error
              (cd crates/nub-native && cargo build --profile fast)
              mkdir -p runtime/addons "$output"
              case "$RUNNER_OS" in
                Windows)
                  cp "$CARGO_TARGET_DIR/fast/nub_native.dll" runtime/addons/nub-native.node
                  echo '07bb1e5b095b00d68a695481f9240879f33c5724b40aa2308f999d54ed78f075  vendor/busybox-w32/busybox64.exe' | sha256sum -c -
                  cp vendor/busybox-w32/busybox64.exe "$output/busybox.exe" ;;
                Linux) cp "$CARGO_TARGET_DIR/fast/libnub_native.so" runtime/addons/nub-native.node ;;
                macOS) cp "$CARGO_TARGET_DIR/fast/libnub_native.dylib" runtime/addons/nub-native.node ;;
              esac
              cargo build -p nub-cli --profile fast --features nub-cli/build-jail-catalog-override
              cp "$CARGO_TARGET_DIR/fast/nub${{ runner.os == 'Windows' && '.exe' || '' }}" "$output/nub${{ runner.os == 'Windows' && '.exe' || '' }}"
              cp runtime/addons/nub-native.node "$output/nub-native.node"
            )
          }
          build_subject /tmp/nub-candidate /tmp/subjects/candidate /tmp/nub-catalog-sanity-target/candidate 2>&1 | tee "$REPORTS/candidate-build.log"
          build_subject /tmp/nub-baseline /tmp/subjects/baseline /tmp/nub-catalog-sanity-target/baseline 2>&1 | tee "$REPORTS/baseline-build.log"

      - name: Save candidate build target
        if: success() && steps.candidate-target.outputs.cache-matched-key == ''
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CANDIDATE_TARGET_CACHE_PATH }}
          key: zero-sandbox-catalog-sanity-v2-${{ runner.os }}-candidate-${{ env.CANDIDATE_SHA }}

      - name: Save baseline build target
        if: success() && steps.baseline-target.outputs.cache-matched-key == ''
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BASELINE_TARGET_CACHE_PATH }}
          key: zero-sandbox-catalog-sanity-v2-${{ runner.os }}-baseline-${{ env.BASELINE_SHA }}

      - name: Screen the exact worklist
        run: |
          set -euo pipefail
          mkdir -p reports/security
          node harness/osv-screen.mjs --kind catalog-sanity-worklist --cache-dir reports/security/clearances --out reports/security/worklist.json \
            --spec 'esbuild@0.24.0' \
            --spec 'better-sqlite3@11.8.1' \
            --spec 'bcrypt@5.1.1' \
            --spec 'sharp@0.33.5' \
            --spec '@swc/core@1.15.46' \
            --spec 'cpu-features@0.0.10' \
            --spec 'better-sqlite3@11.8.1'

      - name: Run independent current-catalog subjects
        run: |
          set +e
          # The fixture asserts this location and records the requested and actual roots.  The
          # short Windows path prevents the prior CPU control's C1083 failure from being misread
          # as jail evidence.
          if [ "$RUNNER_OS" = Windows ]; then
            export CORPUS_TEMP_ROOT='C:/p'
            # Match the native source-build gate's known-good control interpreter. The fixture
            # applies it only to its unconfined source-build arm.
            export CORPUS_CONTROL_PYTHON='C:/hostedtoolcache/windows/Python/3.12.10/x64/python.exe'
            test -f "$CORPUS_CONTROL_PYTHON"
          else
            unset CORPUS_TEMP_ROOT CORPUS_CONTROL_PYTHON
          fi
          CATALOG="$GITHUB_WORKSPACE/catalog-v2.json"
          printf '{"packages":{"x":{"default":{"read":"disk","write":"disk"}}}}' > /tmp/catalog-bad.json
          FIXTURES=/tmp/nub-candidate/tests/build-jail-corpus
          CORPUS_OSV_SCREEN="$GITHUB_WORKSPACE/harness/osv-screen.mjs" node harness/v2/catalog-sanity-subject.mjs --subject baseline --bin "/tmp/subjects/baseline/nub${{ runner.os == 'Windows' && '.exe' || '' }}" --catalog "$CATALOG" --bad-catalog /tmp/catalog-bad.json --fixtures "$FIXTURES" --report reports/baseline
          baseline_rc=$?
          # The older baseline must acquire Windows registry state before the candidate. Candidate
          # first polluted its persistent schema and made baseline package failures non-comparable.
          CORPUS_OSV_SCREEN="$GITHUB_WORKSPACE/harness/osv-screen.mjs" node harness/v2/catalog-sanity-subject.mjs --subject candidate --bin "/tmp/subjects/candidate/nub${{ runner.os == 'Windows' && '.exe' || '' }}" --catalog "$CATALOG" --bad-catalog /tmp/catalog-bad.json --fixtures "$FIXTURES" --report reports/candidate
          candidate_rc=$?
          printf '%s\n' "$candidate_rc" > reports/candidate.exit
          printf '%s\n' "$baseline_rc" > reports/baseline.exit
          if [ "$RUNNER_OS" = Windows ]; then
            node -e 'const assert=require("node:assert/strict"),{readFileSync}=require("node:fs"),{dirname,resolve}=require("node:path"),expected=resolve(process.env.CORPUS_TEMP_ROOT),reports=["candidate","baseline"].map(subject=>{const report=JSON.parse(readFileSync("reports/"+subject+"/packages/provenance.json","utf8"));assert.equal(report.requestedTempRoot,expected,subject+" requested root");assert.equal(dirname(report.fixtureRoot),expected,subject+" actual root");return report});assert.notEqual(reports[0].fixtureRoot,reports[1].fixtureRoot,"subjects use separate fixture roots")'
            root_rc=$?
            if [ "$root_rc" -ne 0 ]; then exit "$root_rc"; fi
          fi
          # The baseline is retained comparison evidence. Candidate acceptance is never inferred
          # from a baseline pass/failure; it requires its own real installs and denied controls.
          exit "$candidate_rc"

      - name: Write immutable provenance manifest
        if: always()
        run: |
          set -euo pipefail
          busybox=()
          if [ "$RUNNER_OS" = Windows ]; then
            busybox=(--candidate-busybox /tmp/subjects/candidate/busybox.exe --baseline-busybox /tmp/subjects/baseline/busybox.exe)
          fi
          # Bash with nounset treats an empty array expansion as an unbound variable.
          # Keep nounset for setup, then permit the intentionally empty non-Windows tail.
          set +u
          node harness/v2/catalog-sanity-manifest.mjs \
            --out reports/manifest.json \
            --corpus-sha "$CORPUS_REF" \
            --candidate-source-sha "${CANDIDATE_SHA:-unresolved}" \
            --baseline-source-sha "${BASELINE_SHA:-unresolved}" \
            --catalog catalog-v2.json \
            --candidate-bin "/tmp/subjects/candidate/nub${{ runner.os == 'Windows' && '.exe' || '' }}" \
            --candidate-addon /tmp/subjects/candidate/nub-native.node \
            --baseline-bin "/tmp/subjects/baseline/nub${{ runner.os == 'Windows' && '.exe' || '' }}" \
            --baseline-addon /tmp/subjects/baseline/nub-native.node \
            --candidate-build-log reports/candidate-build.log \
            --baseline-build-log reports/baseline-build.log \
            --packages /tmp/nub-candidate/tests/build-jail-corpus/packages.mjs \
            --network harness/v2/catalog-sanity-network.mjs \
            --relocated-store /tmp/nub-candidate/tests/build-jail-corpus/relocated-store.mjs \
            --instrument harness/v2/instrument.mjs \
            --instrument-output reports/instrument.json \
            --workflow .github/workflows/zero-sandbox-catalog-sanity.yml \
            --manifest-helper harness/v2/catalog-sanity-manifest.mjs \
            --subject-helper harness/v2/catalog-sanity-subject.mjs \
            --budget-helper harness/v2/catalog-sanity-budget.mjs \
            --environment reports/environment.txt \
            "${busybox[@]}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zero-sandbox-catalog-sanity-${{ matrix.os }}
          path: reports
          retention-days: 14
