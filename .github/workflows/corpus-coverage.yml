# Is the corpus complete against `corpus/packages.txt`, and dispatch what is missing.
#
# THE WORKFLOW: read the list, resolve each package's CURRENT latest, look for a committed record per
# platform, report the gaps. Adding a package to the corpus is one line in that file; this job is what
# makes the line mean something.
#
# ⛔⛔ THE PATH FILTER IS THE LOAD-BEARING SAFETY PROPERTY, NOT AN OPTIMISATION. Measurement runs COMMIT
# records, and this job READS records — so a naive trigger would have results committing, waking the
# checker, dispatching more measurement, forever. `paths` deliberately excludes `records-v2/**`: a
# results commit cannot trigger a dispatch. That alone breaks the cycle. Three further guards back it:
# the queue's `claimed` rows carry their run id and cannot be double-claimed; the gap set is a pure
# function of (list, records, today's latest) and every measurement strictly shrinks it, so the loop is
# monotone and converges even if re-run on every commit; and results land as a bot PR rather than a push
# to main, so PR CI validates record shape before anything becomes evidence.
#
# ⛔ DO NOT ADD `records-v2/**` TO `paths`. It reads like an obvious completeness improvement — "re-check
# whenever records change" — and it is precisely the edge that makes this self-triggering.
name: corpus-coverage

on:
  pull_request:
    paths:
      - 'corpus/packages.txt'
      - 'harness/**'
      - '.github/workflows/corpus-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'corpus/packages.txt'
      - 'harness/**'
  # A newly PUBLISHED version opens a gap without anything in this repo changing, which no
  # content-triggered run can notice. The schedule is the only thing that catches it.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      dispatch:
        description: >-
          Also DISPATCH measurement runs for the gaps found. Off by default: a
          dispatcher that fires on its first contact with a 784-package list can
          spend a great many runner hours before anyone reads the log.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  coverage:
    name: coverage against corpus/packages.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Unit-test the checker before trusting its answer
        # ⛔ THE CHECKER'S OWN TESTS RUN FIRST, and this ordering is deliberate. Its false NEGATIVES are
        # the dangerous direction — a package wrongly reported covered is one that silently never gets
        # measured — so a broken checker reporting "complete" is the worst output this job can produce.
        # Nine tests pin exactly that polarity, and they need no network.
        #
        # The converter's tests run here too, where they gate the answer, rather than in the queue job
        # below: its failure mode is a DUPLICATE queue row, which is two runners measuring one package.
        run: node --test corpus/check-coverage.test.mjs corpus/gaps-to-queue.test.mjs

      - name: Report coverage
        id: coverage
        # ⛔ NEVER `| tee` HERE. The checker exits non-zero when incomplete, and a pipe makes the step
        # read tee's status instead — so the job would go green on every gap and this whole workflow
        # would report success while measuring nothing.
        #
        # The three outcomes are deliberately NOT the same thing:
        #   0 = complete; 1 = gaps and/or unresolvable names, which is ordinary work, not a failure;
        #   anything else = the checker itself broke, which must go red immediately.
        run: |
          set +e
          node corpus/check-coverage.mjs --json > /tmp/coverage.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::check-coverage.mjs exited $rc — the checker itself is broken"
            cat /tmp/coverage.json || true
            exit "$rc"
          fi
          node -e 'const r=require("/tmp/coverage.json"); console.log(`gaps ${(r.gaps??[]).length}  unresolvable ${(r.unresolved??[]).length}`)'

      - name: Summarise
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            let r; try { r = JSON.parse(fs.readFileSync("/tmp/coverage.json", "utf8")); } catch { process.exit(0); }
            const lines = [];
            lines.push(`## corpus coverage`, "");
            lines.push(`- gaps: **${(r.gaps ?? []).length}**`);
            lines.push(`- unresolvable names: **${(r.unresolved ?? []).length}**`);
            if ((r.unresolved ?? []).length) {
              lines.push("", "### unresolvable — these are typos or unpublished packages, not coverage");
              for (const u of r.unresolved.slice(0, 20)) lines.push(`- \`${u.name}\` — ${u.why}`);
            }
            if ((r.gaps ?? []).length) {
              lines.push("", "### gaps (first 40)");
              for (const g of r.gaps.slice(0, 40)) lines.push(`- \`${g.name}@${g.version}\` on ${g.platform}`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      # A typo'd or unpublished line resolves to NOTHING, so it can never be covered and can never be
      # measured — it would sit in the list forever looking like work in progress. That is a defect in the
      # list and a human must fix it, so it is the one condition that turns this job red. GAPS DO NOT:
      # a new release opens one every week, and a job that is red by default is a job nobody reads.
      - name: Fail on unresolvable names — a gap is work, a typo is a defect
        run: |
          node -e '
            const r = require("/tmp/coverage.json");
            const bad = r.unresolved ?? [];
            if (!bad.length) { console.log("every name in corpus/packages.txt resolves"); process.exit(0); }
            for (const u of bad) console.log(`::error::corpus/packages.txt: ${u.name} — ${u.why}`);
            process.exit(1);
          '

      - name: Keep the gap set for the queue job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: /tmp/coverage.json
          if-no-files-found: warn

  # Gaps become QUEUE ROWS, and `corpus-queue-runner` claims them exactly as it already does.
  #
  # ⛔⛔ ROWS, NOT DISPATCHES. The runner's claim (`pending` -> `claimed` carrying the run id, pushed
  # before any measuring starts) is the only thing that stops two runners taking the same package.
  # Handing specs straight to a runner as workflow inputs bypasses it, and then the queue no longer
  # reflects what is in flight. `corpus/gaps-to-queue.mjs` carries the same warning.
  #
  # ⛔ A SEPARATE JOB SO THE WRITE SCOPE IS SEPARATE. This one needs `contents: write` to push a branch;
  # the coverage job above must not, because it runs on every pull request — including from a fork.
  queue:
    name: turn gaps into queue rows (bot PR)
    needs: coverage
    # ⛔ GATED, AND OFF BY DEFAULT ON PURPOSE. The list carries 784 packages across three platforms, so a
    # dispatcher firing unprompted on its first run can consume a great many runner hours before anyone
    # reads the summary. Turn it on deliberately once the gap count looks like what you expect. The
    # precedent is measured: one win32 measurement lane ran 10h51m and spent 53% of its time on timeouts
    # that produced no measurement at all.
    #
    # ⛔ `!cancelled()` IS LOAD-BEARING, NOT DEFENSIVE NOISE. `needs: coverage` alone skips this job
    # whenever coverage goes red, and coverage goes red on an unresolvable name — a state that coexists
    # with perfectly good gaps. Without this the queue would silently never fill on exactly the runs that
    # had work to do, and the workflow would look like it was functioning.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.dispatch }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: /tmp/cov

      - name: Append pending rows for gaps the queue does not already carry
        id: rows
        run: |
          node corpus/gaps-to-queue.mjs --coverage /tmp/cov/coverage.json --apply | tee /tmp/rows.txt
          git diff --quiet queue-v2.ndjson && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      # ⛔ A BOT PR, NOT A PUSH TO MAIN. Records are evidence, so PR CI validates their shape before they
      # count — and a human seeing WHICH packages are about to consume runner hours is the last check on
      # a gap set computed from a 784-name list.
      - name: Open a PR with the new rows
        if: steps.rows.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="bot/queue-gaps-${{ github.run_id }}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add queue-v2.ndjson
          git commit -m "corpus: queue $(grep -c '^  + ' /tmp/rows.txt || echo 0) coverage gap(s) as pending rows"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "corpus: queue coverage gaps as pending rows" \
            --body "$(printf 'Rows appended by `corpus-coverage` run %s.\n\n```\n%s\n```\n' "${{ github.run_id }}" "$(cat /tmp/rows.txt)")"
