name: Catalog-boundary artifact-only records

on:
  push:
    branches: [probe/final-fresh-seven-artifacts]
  workflow_dispatch:
    inputs:
      chunk:
        description: Fresh-seven chunk (1..2), or native diagnostic subset (3)
        required: true
        type: string
      platform:
        description: Operating system to measure
        required: true
        type: choice
        options: [linux, macos, windows]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - id: plan
        name: Validate the bounded run plan
        shell: bash
        env:
          CHUNK: ${{ inputs.chunk }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          args=(--matrix --manifest inputs/final-fresh-seven-inputs.json --plan inputs/final-fresh-seven-run.json)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            args+=(--chunk "$CHUNK" --platform "$PLATFORM")
          fi
          matrix=$(node harness/v2/catalog-campaign-input.mjs "${args[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  records:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      NUB_REF: 820c6b639b42f96dfc27c68b4158522bd57d9b47
      NUB_CORPUS_ON_RECORD: ''
      NUB_JAIL_DUMP_POLICY: '1'
      MANIFEST: inputs/final-fresh-seven-inputs.json
      RUN_PLAN: inputs/final-fresh-seven-run.json
      CHUNK: ${{ matrix.chunk }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          sparse-checkout: |
            harness
            inputs
            .github
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - name: Materialize and screen one bounded worklist
        run: |
          set -euo pipefail
          mkdir -p reports
          node harness/v2/catalog-campaign-input.mjs \
            --manifest "$MANIFEST" --chunk "$CHUNK" --platform "$PLATFORM" \
            --out reports/worklist.txt --screen --cache-dir reports/osv-cache \
            > reports/worklist-selection.json
          cp "$MANIFEST" reports/catalog-campaign-inputs.json
          printf '%s  %s\n' "$(node harness/v2/campaign-provenance.mjs --sha256 --file "$MANIFEST")" "$MANIFEST" > reports/catalog-campaign-inputs.sha256
          cp "$RUN_PLAN" reports/final-fresh-seven-run.json
      - name: Record the source and runner before any gate
        run: |
          set -euo pipefail
          { git rev-parse HEAD; node --version; npm --version; rustc -Vv; uname -a; } > reports/environment.txt
          node harness/v2/instrument.mjs --json > reports/instrument.json
      - name: Activate the Windows tracer compiler
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./harness/v2/activate-msvc.ps1
      - name: Check the complete measurement instrument
        run: |
          set -euo pipefail
          node harness/run-tests.mjs 2>&1 | tee reports/harness-tests.log
      - name: Check Linux observation support
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace
          strace -f -o /tmp/strace-control.txt /bin/true
          grep -q execve /tmp/strace-control.txt
      - name: Check macOS observation support
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          csrutil status
          sudo dtrace -n 'BEGIN { trace("hello"); exit(0); }' 2>&1 | tee /tmp/dtrace-control.txt
          grep -q hello /tmp/dtrace-control.txt
      # The worklist is screened before this tool preparation or any dependency install.  This runs
      # even on an exact cache hit because node-gyp is part of the runner evidence, not the bundle.
      - name: Prepare the node-gyp toolchain on every run
        run: npm install --global node-gyp@12.4.0 --no-audit --no-fund
      - name: Resolve the exact runtime bundle identity
        run: |
          set -euo pipefail
          RUNTIME_BUNDLE=/tmp/catalog-boundary-runtime
          RUNTIME_BUNDLE_CACHE_PATH="$RUNTIME_BUNDLE"
          if [ "$RUNNER_OS" = Windows ]; then RUNTIME_BUNDLE_CACHE_PATH="$(cygpath -w "$RUNTIME_BUNDLE")"; fi
          BUNDLE_PLATFORM=$(node -p 'process.platform')
          BUNDLE_ARCH=$(node -p 'process.arch')
          RUNTIME_NODE_VERSION=$(node --version)
          RUNTIME_RUSTC_SHA256=$(rustc -Vv | node harness/v2/campaign-provenance.mjs --sha256-stdin)
          # The actual checked-in recipe and its verifier define the cached bytes.  Hashing them,
          # rather than a duplicated prose summary, makes every recipe edit a fresh exact key.
          RUNTIME_RECIPE_SHA256=$(cat .github/workflows/catalog-boundary-artifact-records.yml harness/v2/runtime-bundle.mjs | node harness/v2/campaign-provenance.mjs --sha256-stdin)
          RUNTIME_CACHE_KEY=$(node harness/v2/runtime-bundle.mjs --cache-key \
            --candidate-sha "$NUB_REF" --platform "$BUNDLE_PLATFORM" --arch "$BUNDLE_ARCH" \
            --profile fast --features nub-cli/build-jail-catalog-override --recipe-sha256 "$RUNTIME_RECIPE_SHA256" \
            --node-version "$RUNTIME_NODE_VERSION" --rustc-sha256 "$RUNTIME_RUSTC_SHA256")
          {
            echo "NUB_GIT_SHA=$NUB_REF"
            echo "RUNTIME_BUNDLE=$RUNTIME_BUNDLE"
            echo "RUNTIME_BUNDLE_CACHE_PATH=$RUNTIME_BUNDLE_CACHE_PATH"
            echo "BUNDLE_PLATFORM=$BUNDLE_PLATFORM"
            echo "BUNDLE_ARCH=$BUNDLE_ARCH"
            echo "RUNTIME_RECIPE_SHA256=$RUNTIME_RECIPE_SHA256"
            echo "RUNTIME_NODE_VERSION=$RUNTIME_NODE_VERSION"
            echo "RUNTIME_RUSTC_SHA256=$RUNTIME_RUSTC_SHA256"
            echo "RUNTIME_CACHE_KEY=$RUNTIME_CACHE_KEY"
          } >> "$GITHUB_ENV"
      # Exact identity only: never add restore-keys.  A different commit, target, or recipe is not
      # evidence for this campaign and must pay its own build once, rather than reuse stale bytes.
      - name: Restore the exact runtime bundle
        id: runtimebundle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RUNTIME_BUNDLE_CACHE_PATH }}
          key: ${{ env.RUNTIME_CACHE_KEY }}
      - name: Verify a restored runtime bundle
        if: steps.runtimebundle.outputs.cache-matched-key != ''
        run: |
          set -euo pipefail
          node harness/v2/runtime-bundle.mjs --verify --root "$RUNTIME_BUNDLE" \
            --candidate-sha "$NUB_GIT_SHA" --platform "$BUNDLE_PLATFORM" --arch "$BUNDLE_ARCH" \
            --profile fast --features nub-cli/build-jail-catalog-override --recipe-sha256 "$RUNTIME_RECIPE_SHA256" \
            --node-version "$RUNTIME_NODE_VERSION" --rustc-sha256 "$RUNTIME_RUSTC_SHA256" \
            | tee reports/runtime-bundle.json
      - name: Build the exact full Nub runtime bundle when cache misses
        if: steps.runtimebundle.outputs.cache-matched-key == ''
        run: |
          set -euo pipefail
          rm -rf /tmp/nubsrc "$RUNTIME_BUNDLE"
          git init /tmp/nubsrc
          git -C /tmp/nubsrc remote add origin https://github.com/nubjs/nub.git
          git -C /tmp/nubsrc fetch --depth=1 origin "$NUB_GIT_SHA"
          git -C /tmp/nubsrc checkout --detach FETCH_HEAD
          SHA=$(git -C /tmp/nubsrc rev-parse HEAD)
          test "$SHA" = "$NUB_GIT_SHA"
          (
            cd /tmp/nubsrc
            if [ "$RUNNER_OS" = Windows ]; then
              (cd vendor/aube && cargo test -p aube --lib global_virtual_store_lifecycle_uses_logical_bin_path -- --nocapture) \
                2>&1 | tee "$GITHUB_WORKSPACE/reports/logical-bin-path-test.log"
              grep -q 'test result: ok. 1 passed' "$GITHUB_WORKSPACE/reports/logical-bin-path-test.log"
            fi
            npm install --no-audit --no-fund --loglevel=error
            (cd crates/nub-native && cargo build --profile fast)
            mkdir -p runtime/addons
            case "$RUNNER_OS" in
              Linux) cp target/fast/libnub_native.so runtime/addons/nub-native.node ;;
              macOS) cp target/fast/libnub_native.dylib runtime/addons/nub-native.node ;;
              Windows)
                cp target/fast/nub_native.dll runtime/addons/nub-native.node
                echo '07bb1e5b095b00d68a695481f9240879f33c5724b40aa2308f999d54ed78f075  vendor/busybox-w32/busybox64.exe' | sha256sum -c -
                cp vendor/busybox-w32/busybox64.exe target/fast/busybox.exe ;;
            esac
            # The fast binary walks to this complete sidecar at runtime.  Stage the same exact
            # vendored JS packages as the release workflow, without inheriting source-root links.
            RUNTIME_DEP_SPECS_TEXT=$(node "$GITHUB_WORKSPACE/harness/v2/runtime-bundle.mjs" \
              --runtime-dependency-specs --source-root "$PWD")
            RUNTIME_DEP_SPECS=()
            while IFS= read -r spec; do RUNTIME_DEP_SPECS+=("$spec"); done <<< "$RUNTIME_DEP_SPECS_TEXT"
            [ "${#RUNTIME_DEP_SPECS[@]}" -eq 5 ] || { echo 'incomplete runtime dependency specs' >&2; exit 1; }
            rm -rf runtime/node_modules
            mkdir -p runtime/node_modules
            (
              cd runtime
              npm init -y > /dev/null 2>&1
              npm install --no-save "${RUNTIME_DEP_SPECS[@]}"
              rm -f node_modules/.package-lock.json package.json package-lock.json
            )
            node "$GITHUB_WORKSPACE/harness/v2/runtime-bundle.mjs" --verify-runtime-dependencies \
              --source-root "$PWD" --runtime-root "$PWD/runtime"
            if find runtime -type l -print -quit | grep -q .; then
              echo 'runtime staging contains a symlink' >&2
              exit 1
            fi
            cargo build -p nub-cli --profile fast --features nub-cli/build-jail-catalog-override
          ) 2>&1 | tee reports/runtime-build.log
          mkdir -p "$RUNTIME_BUNDLE"
          cp "/tmp/nubsrc/target/fast/nub${{ matrix.platform == 'windows' && '.exe' || '' }}" "$RUNTIME_BUNDLE/nub${{ matrix.platform == 'windows' && '.exe' || '' }}"
          cp -R /tmp/nubsrc/runtime "$RUNTIME_BUNDLE/runtime"
          if [ "$BUNDLE_PLATFORM" = win32 ]; then
            cp /tmp/nubsrc/target/fast/busybox.exe "$RUNTIME_BUNDLE/busybox.exe"
            mkdir -p "$RUNTIME_BUNDLE/runtime/test-evidence"
            cp reports/logical-bin-path-test.log "$RUNTIME_BUNDLE/runtime/test-evidence/logical-bin-path-test.log"
          fi
          node harness/v2/runtime-bundle.mjs --write --root "$RUNTIME_BUNDLE" \
            --candidate-sha "$NUB_GIT_SHA" --platform "$BUNDLE_PLATFORM" --arch "$BUNDLE_ARCH" \
            --profile fast --features nub-cli/build-jail-catalog-override --recipe-sha256 "$RUNTIME_RECIPE_SHA256" \
            --node-version "$RUNTIME_NODE_VERSION" --rustc-sha256 "$RUNTIME_RUSTC_SHA256" \
            | tee reports/runtime-bundle.json
      - name: Verify the runtime bundle before measurement
        run: |
          set -euo pipefail
          node harness/v2/runtime-bundle.mjs --verify --root "$RUNTIME_BUNDLE" \
            --candidate-sha "$NUB_GIT_SHA" --platform "$BUNDLE_PLATFORM" --arch "$BUNDLE_ARCH" \
            --profile fast --features nub-cli/build-jail-catalog-override --recipe-sha256 "$RUNTIME_RECIPE_SHA256" \
            --node-version "$RUNTIME_NODE_VERSION" --rustc-sha256 "$RUNTIME_RUSTC_SHA256" \
            | tee reports/runtime-bundle-verified.json
          if [ "$BUNDLE_PLATFORM" = win32 ]; then
            cp "$RUNTIME_BUNDLE/runtime/test-evidence/logical-bin-path-test.log" reports/logical-bin-path-test.log
            grep -q 'test result: ok. 1 passed' reports/logical-bin-path-test.log
          fi
          NUB_BIN="$RUNTIME_BUNDLE/nub"
          [ "$BUNDLE_PLATFORM" = win32 ] && NUB_BIN="$NUB_BIN.exe"
          chmod +x "$NUB_BIN" 2>/dev/null || true
          "$NUB_BIN" --version
          echo "NUB_BIN=$NUB_BIN" >> "$GITHUB_ENV"
      - name: Smoke the source-free runtime sidecar
        run: |
          set -euo pipefail
          rm -rf /tmp/nubsrc
          SMOKE="$RUNNER_TEMP/catalog-runtime-smoke"
          rm -rf "$SMOKE"; mkdir -p "$SMOKE"
          printf 'name: nub\nport: 5432\n' > "$SMOKE/input.yaml"
          printf 'import value from "./input.yaml"; console.log(value.name + ":" + value.port);\n' > "$SMOKE/smoke.ts"
          (cd "$SMOKE" && "$NUB_BIN" smoke.ts) | tee reports/runtime-sidecar-smoke.log
          grep -qx 'nub:5432' reports/runtime-sidecar-smoke.log
      # This is an input to the current-v2-grants replay, not a runtime sidecar file: it must be
      # materialized on cache hits too, after the source-free bundle smoke has ruled out fallback.
      - name: Materialize the pinned current-v2 catalog input
        run: |
          set -euo pipefail
          PIN_LINE=$(node -e 'const fs = require("node:fs"); const pin = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).pins?.candidate; if (!pin || typeof pin.commit !== "string" || typeof pin.catalogPath !== "string" || !/^[0-9a-f]{64}$/i.test(pin.catalogSha256 ?? "")) throw new Error("candidate catalog pin is incomplete"); process.stdout.write([pin.commit, pin.catalogPath, pin.catalogSha256].join(" "));' "$MANIFEST")
          read -r PIN_COMMIT PIN_PATH PIN_SHA256 <<< "$PIN_LINE"
          test "$PIN_COMMIT" = "$NUB_REF"
          case "$PIN_PATH" in /*|*'..'*) echo 'unsafe candidate catalog path' >&2; exit 1 ;; esac
          rm -rf /tmp/nub-catalog-input
          git init -q /tmp/nub-catalog-input
          git -C /tmp/nub-catalog-input remote add origin https://github.com/nubjs/nub.git
          git -C /tmp/nub-catalog-input fetch --depth=1 origin "$NUB_REF"
          git -C /tmp/nub-catalog-input checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/nub-catalog-input rev-parse HEAD)" = "$PIN_COMMIT"
          # `cp` would inherit a CRLF-converted checkout on Windows. Extract the pinned blob from
          # Git instead, then prove both the checked-out ref and canonical blob digest before use.
          node harness/v2/pinned-git-blob.mjs \
            --repo /tmp/nub-catalog-input --ref HEAD --commit "$PIN_COMMIT" --path "$PIN_PATH" \
            --sha256 "$PIN_SHA256" --out reports/candidate-catalog-v2.json
          test "$(node harness/v2/campaign-provenance.mjs --sha256 --file reports/candidate-catalog-v2.json)" = "$PIN_SHA256"
          mkdir -p reports/native-fixtures
          for file in packages.mjs packages.test.mjs; do
            git -C /tmp/nub-catalog-input show "$PIN_COMMIT:tests/build-jail-corpus/$file" > "reports/native-fixtures/$file"
          done
          sha256sum reports/native-fixtures/* > reports/native-fixtures.sha256
          rm -rf /tmp/nub-catalog-input
      - name: Save the newly built exact runtime bundle
        if: steps.runtimebundle.outputs.cache-matched-key == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RUNTIME_BUNDLE_CACHE_PATH }}
          key: ${{ env.RUNTIME_CACHE_KEY }}
      - name: Verify native build configuration and exports
        if: matrix.chunk == 2 || matrix.chunk == 3
        run: |
          set -euo pipefail
          node --test reports/native-fixtures/packages.test.mjs | tee reports/native-fixture-tests.log
          export NUB_BUILD_JAIL_CATALOG="$GITHUB_WORKSPACE/reports/candidate-catalog-v2.json"
          export CORPUS_OSV_SCREEN="$GITHUB_WORKSPACE/harness/osv-screen.mjs"
          if [ "$PLATFORM" = windows ]; then
            mkdir -p /c/p/native-config-probe
            export CORPUS_TEMP_ROOT='C:/p/native-config-probe'
          fi
          for package in cpu-features better-sqlite3; do
            CORPUS_CASE="$package" CORPUS_REPORT="$GITHUB_WORKSPACE/reports/native-$package" \
              node reports/native-fixtures/packages.mjs | tee "reports/native-$package.log"
          done
          unset NUB_BUILD_JAIL_CATALOG CORPUS_OSV_SCREEN CORPUS_TEMP_ROOT
      - id: campaigncontext
        name: Bind source, bundle, and campaign inputs
        run: |
          set -euo pipefail
          node harness/v2/campaign-provenance.mjs --create --out reports/campaign-context.json \
            --runtime-bundle "$RUNTIME_BUNDLE" --runtime-recipe-sha256 "$RUNTIME_RECIPE_SHA256" \
            --catalog catalog-v2.json --worklist reports/worklist.txt --manifest "$MANIFEST" \
            --run-plan "$RUN_PLAN" --workflow .github/workflows/catalog-boundary-artifact-records.yml
          node harness/v2/campaign-provenance.mjs --create --out reports/candidate-catalog-context.json \
            --runtime-bundle "$RUNTIME_BUNDLE" --runtime-recipe-sha256 "$RUNTIME_RECIPE_SHA256" \
            --catalog reports/candidate-catalog-v2.json --worklist reports/worklist.txt --manifest "$MANIFEST" \
            --run-plan "$RUN_PLAN" --workflow .github/workflows/catalog-boundary-artifact-records.yml
          node --input-type=module - "$NUB_BIN" <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const hash = (p) => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const instrument = JSON.parse(fs.readFileSync('reports/instrument.json', 'utf8'));
          const campaign = JSON.parse(fs.readFileSync('reports/campaign-context.json', 'utf8')).campaign;
          const expected = { platform: `${process.platform}-${process.arch}`, nubGitSha: process.env.NUB_GIT_SHA,
            corpusGitSha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            harnessSha256: instrument.harnessSha256, nubSha256: hash(process.argv[2]), campaign };
          fs.writeFileSync('reports/expected.json', JSON.stringify(expected, null, 2));
          JS
      - name: Measure the screened worklist with falsification enabled
        run: |
          set -euo pipefail
          git diff --exit-code -- harness
          unset NUB_CORPUS_ON_RECORD NUB_CORPUS_REPO NUB_CORPUS_BRANCH NUB_CORPUS_MANIFEST
          export NUB_V2_CAMPAIGN_CONTEXT="$GITHUB_WORKSPACE/reports/campaign-context.json"
          if [ "$PLATFORM" = windows ]; then
            mkdir -p /c/p/jail-record-probe
            export NUB_V2_DRIVER_ARGS='["--root","C:\\p\\jail-record-probe"]'
          fi
          node harness/v2/run-batch-v2.mjs --file reports/worklist.txt --nub "$NUB_BIN" --runs "$GITHUB_WORKSPACE/reports/records" --force 2>&1 | tee reports/measure.log
      - name: Replay the bound external catalog directly
        if: ${{ always() && !cancelled() && steps.campaigncontext.outcome == 'success' }}
        run: |
          set -euo pipefail
          args=(
            --nub "$NUB_BIN" --nub-git-sha "$NUB_GIT_SHA" \
            --catalog catalog-v2.json --worklist reports/worklist.txt \
            --context reports/campaign-context.json --out reports/catalog-replay
          )
          if [ "$PLATFORM" = windows ]; then args+=(--driver-root 'C:/p/jail-record-probe'); fi
          node harness/v2/catalog-replay.mjs "${args[@]}" 2>&1 | tee reports/catalog-replay.log
      - name: Replay the pinned current-v2 catalog grants directly
        if: ${{ always() && !cancelled() && steps.campaigncontext.outcome == 'success' }}
        run: |
          set -euo pipefail
          args=(
            --nub "$NUB_BIN" --nub-git-sha "$NUB_GIT_SHA" \
            --catalog reports/candidate-catalog-v2.json --worklist reports/worklist.txt \
            --context reports/candidate-catalog-context.json --out reports/candidate-307-replay
          )
          if [ "$PLATFORM" = windows ]; then args+=(--driver-root 'C:/p/jail-record-probe'); fi
          node harness/v2/catalog-replay.mjs "${args[@]}" 2>&1 | tee reports/candidate-307-replay.log
      - name: Require complete exact-candidate measurements
        if: always()
        run: node harness/v2/assert-probe-records.mjs --file reports/worklist.txt --runs reports/records --expected reports/expected.json --out reports/record-summary.json
      - name: Preserve failed falsification arms
        if: always()
        run: node harness/v2/collect-preflight.mjs reports/measure.log reports/preflight-evidence
      - name: Retain evidence without publishing records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-fresh-seven-${{ matrix.platform }}-chunk-${{ matrix.chunk }}
          path: reports
          retention-days: 14
